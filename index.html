<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15161A;--ink2:#282930;--text:#41434D;--mute:#656874;--faint:#838693;
  --line:#D5D6DD;--line2:#E5E6EB;--soft:#F0F2ED;--paper:#F7F8F5;--bg:#E8E9EC;
  --lime:#FFFFFF;--late:#B9442F;--lateDot:#DD644E;--ok:#5E7F2C;
  --display:'Space Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:14px/1.45 'DM Sans',system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:geometricPrecision}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
::selection{background:var(--lime);color:var(--ink)}
*{scrollbar-width:thin;scrollbar-color:#BEC1CB transparent}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mute{color:var(--mute)}
.eyebrow{margin:0;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}

/* ---------- sidebar ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;z-index:20;width:252px;display:flex;flex-direction:column;padding:26px 16px 18px;background:var(--ink);color:#fff;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 24px;border:0;background:transparent;color:#fff;font:700 22px/1 var(--display);letter-spacing:-.04em;text-align:left}
.brand svg{transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.brand:hover svg{transform:translateX(3px) skewX(-5deg)}
.workspace{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #2F3139;border-radius:10px;background:#1E1F24}
.workspace-avatar{width:34px;height:34px;display:grid;place-items:center;flex-shrink:0;border-radius:8px;background:var(--lime);color:var(--ink);font-size:12px;font-weight:700}
.workspace>span:not(.workspace-avatar),.profile>span:not(.profile-avatar){display:flex;flex-direction:column;min-width:0}
.workspace b,.profile b{font-size:13px;font-weight:600}
.workspace small,.profile small{color:#818593;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:26px}
.nav-label{padding:0 12px 8px;color:#666976;font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase}
.nav-label.second{margin-top:20px}
.nav a{position:relative;height:42px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:8px;color:#989BA8;font-size:14px;transition:.16s ease}
.nav a:hover{color:#fff;background:#1F2026}
.nav a.on{color:#fff;background:#26272D;box-shadow:inset 0 0 0 1px #32343D;font-weight:600}
.nav a.on::before{content:'';position:absolute;left:0;width:3px;height:18px;border-radius:0 2px 2px 0;background:var(--lime)}
.nav em{margin-left:auto;min-width:24px;padding:2px 7px;border-radius:6px;background:#28292F;color:#989BA8;font-size:12px;font-style:normal;text-align:center}
.nav a.on em{background:var(--lime);color:var(--ink)}
.side-bottom{margin-top:auto;padding:22px 8px 0}
.target{display:flex;justify-content:space-between;align-items:flex-end;font-size:12px}
.target>span{display:flex;flex-direction:column;gap:2px}
.target small{color:#777B89}
.target>b{font-size:13px}
.progress{height:4px;margin:10px 0 18px;border-radius:2px;background:#2D2E34;overflow:hidden}
.progress i{display:block;height:100%;background:var(--lime);border-radius:inherit;transition:width .4s}
.profile{display:flex;align-items:center;gap:10px;padding-top:14px;border-top:1px solid #2D2E34}
.profile-avatar{width:36px;height:36px;display:grid;place-items:center;flex-shrink:0;border-radius:9px;background:#B7C8FF;color:var(--ink);font-size:12px;font-weight:700}

/* ---------- main ---------- */
.main{min-width:0;min-height:calc(100vh - 12px);margin:6px 6px 6px 258px;border:1px solid #DDDEE3;border-radius:12px;background-color:var(--paper);background-image:linear-gradient(rgba(24,27,23,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(24,27,23,.03) 1px,transparent 1px);background-size:28px 28px;box-shadow:0 3px 14px rgba(23,24,20,.04)}
.topbar{height:70px;display:flex;align-items:center;gap:12px;padding:0 36px;border-bottom:1px solid var(--line2);background:rgba(247,248,245,.85);border-radius:12px 12px 0 0}
.search{width:440px;max-width:100%;height:42px;display:flex;align-items:center;gap:10px;padding:0 12px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--faint);font-size:14px;text-align:left;transition:.15s}
.search:hover{border-color:var(--line);background:#fff}
.search kbd{margin-left:auto;padding:3px 8px;border:1px solid #D7D9DF;border-radius:5px;background:#F5F5F1;color:#858893;font:12px 'DM Sans';white-space:nowrap}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-button{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:#fff;color:#545763}
.icon-button:hover{border-color:#BABCC7;color:var(--ink)}
.primary-button{height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border:1px solid #141518;border-radius:8px;background:#181A1F;color:#fff;font-size:14px;font-weight:600;box-shadow:0 2px 3px rgba(0,0,0,.12);transition:.16s ease;white-space:nowrap}
.primary-button:hover{transform:translateY(-1px);background:#25272E;box-shadow:0 6px 16px rgba(18,20,16,.16)}
.primary-button:disabled{opacity:.4;transform:none;cursor:not-allowed}
.ghost-button{height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);font-size:14px;font-weight:500;white-space:nowrap}
.ghost-button:hover{border-color:#BABCC7;color:var(--ink);background:#FBFCFA}
.ghost-button.sm,.primary-button.sm{height:36px;padding:0 12px;font-size:13px}
.text-button{display:inline-flex;align-items:center;gap:7px;padding:0;border:0;background:transparent;color:#545763;font-size:13px;font-weight:600;white-space:nowrap}
.text-button:hover{color:var(--ink)}
.danger{color:var(--late)!important}
.page{max-width:1480px;margin:0 auto;padding:40px 40px 56px}
.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.heading-meta{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.heading-meta>span{display:flex;align-items:center;gap:6px;padding-left:10px;border-left:1px solid #D4D6DD;color:var(--mute);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.heading-meta i{width:7px;height:7px;border-radius:50%;background:#4E9F78;box-shadow:0 0 0 3px rgba(78,159,120,.16)}
.page-heading h1{margin:0;font:600 38px/1.08 var(--display);letter-spacing:-.045em}
.page-heading h1 span{color:#818592;font-weight:500}
.page-heading p{margin:10px 0 0;color:var(--mute);font-size:15px}
.heading-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:8px;background:#ECECEF}
.seg button{height:34px;padding:0 14px;border:0;border-radius:6px;background:transparent;color:var(--mute);font-size:13px;font-weight:600;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,23,18,.1)}

/* ---------- surfaces ---------- */
.panel{min-width:0;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(20,23,18,.04);overflow:hidden}
.panel-head{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.panel-head .ttl{display:grid;grid-template-columns:auto 1fr;align-items:baseline;column-gap:10px}
.panel-head .idx{grid-row:1/3;color:#999CA9;font:500 12px var(--display)}
.panel-head h2{margin:0;font:600 17px var(--display);letter-spacing:-.02em}
.panel-head p{grid-column:2;margin:3px 0 0;color:var(--mute);font-size:13px}
.metrics{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:12px;margin-bottom:14px}
.metric{position:relative;min-height:162px;padding:22px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;box-shadow:0 1px 2px rgba(20,23,18,.04);transition:transform .16s,border-color .16s,box-shadow .16s}
.metric:hover{transform:translateY(-2px);border-color:#BABCC7;box-shadow:0 8px 22px rgba(20,23,18,.08)}
.metric.featured{background:#181A1F;border-color:#181A1F;color:#fff}
.metric-label{display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-size:13px;font-weight:500}
.featured .metric-label{color:#9DA0AD}
.trend{padding:3px 8px;border-radius:6px;background:rgba(215,255,63,.14);color:var(--lime);font-size:12px;font-weight:600}
.metric-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:7px;background:var(--soft);color:#595C68}
.metric strong{display:block;margin-top:22px;font:600 32px/1 var(--display);letter-spacing:-.045em}
.metric p{margin:12px 0 0;color:var(--mute);font-size:13px;display:flex;align-items:center;gap:6px}
.metric p b{color:var(--ink2);font-weight:600}
.featured strong{position:relative;z-index:1;font-size:36px}
.featured p{position:relative;z-index:1;color:#8F929E}
.featured p b{color:#fff}
.sparkline{position:absolute;inset:64px 0 0 44%;opacity:.85}
.sparkline svg{width:100%;height:76px;overflow:visible}
.sparkline path{fill:none;stroke:var(--lime);stroke-width:2;vector-effect:non-scaling-stroke}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.75fr);gap:14px}

/* tags */
.tag{width:max-content;display:inline-flex;align-items:center;gap:7px;padding:4px 9px;border-radius:6px;background:#EDEDF0;color:#454752;font-size:12px;font-weight:600;white-space:nowrap}
.avatar{display:inline-grid;place-items:center;flex-shrink:0;border:1px solid #DCDDE3;border-radius:8px;background:var(--soft);color:#494B56;font-weight:700;line-height:1}
.avatar.person{border-radius:50%;border-color:transparent;background:#DBE5FF;color:#384663}
.avatar.lead{border-radius:50%;border-color:transparent;background:#EDE6FF;color:#4F3F86}
.chip{display:inline-flex;align-items:center;gap:9px;white-space:nowrap;min-width:0}

/* tables */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left}
th{height:42px;padding:0 14px;border-bottom:1px solid var(--line2);color:#6C707E;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;background:#FBFCFA}
td{height:66px;padding:0 14px;border-bottom:1px solid #ECECEF;color:var(--text);font-size:14px;white-space:nowrap}
th:first-child,td:first-child{padding-left:22px}
th:last-child,td:last-child{padding-right:22px}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer;transition:background .15s,box-shadow .15s}
tr.row:hover td{background:#F8FAF5}
tr.row:hover td:first-child{box-shadow:inset 3px 0 var(--lime)}
.identity{display:flex;align-items:center;gap:12px;min-width:0;padding:0;border:0;background:transparent;text-align:left}
.identity span.t{display:flex;flex-direction:column;gap:2px;min-width:0}
.identity b{color:var(--ink2);font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.identity small{color:var(--faint);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.val{color:var(--ink2);font-weight:600}
.late-date{display:inline-flex;align-items:center;gap:6px;color:var(--late);font-weight:600}
.today-date{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600}
.empty{padding:56px 24px;text-align:center;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{margin:0;color:var(--ink);font:600 20px var(--display);letter-spacing:-.03em}
.empty .acts{display:flex;gap:8px;margin-top:8px}

/* up next */
.tasks{padding:6px 16px}
.task{display:flex;align-items:center;gap:12px;min-height:70px;border-bottom:1px solid #ECECEF}
.task:last-child{border-bottom:0}
.task-check{width:24px;height:24px;display:grid;place-items:center;flex-shrink:0;padding:0;border:1px solid #CED0D8;border-radius:50%;background:#fff;color:transparent}
.task-check.hot{border-color:#EFAE9F;background:#FFF6F3}
.task-check:hover{border-color:var(--ink)}
.task.done .task-check{border-color:#181A1F;background:#181A1F;color:#fff}
.task-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:0;border:0;background:transparent;text-align:left}
.task-body b{font-size:14px;font-weight:600;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-body small{font-size:12px;color:var(--faint)}
.task.done .task-body{opacity:.5}
.task.done .task-body b{text-decoration:line-through}
.task>svg{color:#AAACB5;flex-shrink:0}
.wide-btn{width:calc(100% - 32px);height:44px;display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 16px 16px;border:1px solid transparent;border-radius:8px;background:var(--soft);color:#545763;font-size:13px;font-weight:600}
.wide-btn:hover{border-color:#D9DBE1;background:#EAEBEE;color:var(--ink)}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid #DDDEE4;border-radius:10px;background:#F5F7F2}
.note>span{width:26px;height:26px;display:grid;place-items:center;flex-shrink:0;border-radius:7px;background:#181A1F;color:var(--lime);font-weight:700;font-size:13px}
.note div{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.note b{color:var(--ink2);font-size:14px}
.note p{margin:0;color:var(--mute);font-size:13px}

/* kanban */
.kanban-note{margin-bottom:14px}
.kanban{display:grid;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:start}
.kcol{min-height:520px;display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid #DCDDE3;border-radius:10px;background:rgba(240,243,238,.88);transition:background .15s,box-shadow .15s}
.kcol.over{background:#F0F1FB;box-shadow:inset 0 0 0 2px var(--lime)}
.khead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 8px;font-size:14px;font-weight:600}
.khead span{display:flex;align-items:center;gap:8px}
.khead em{min-width:26px;padding:3px 7px;border-radius:5px;background:#DEE0E5;color:#595C69;font-size:12px;font-style:normal;text-align:center}
.ksum{padding:0 4px 4px;color:var(--faint);font-size:12px;font-weight:500;margin-top:-6px}
.deal-card{padding:16px;border:1px solid #D9DBE1;border-radius:9px;background:#fff;box-shadow:0 2px 3px rgba(20,20,15,.025);cursor:grab;transition:transform .15s,box-shadow .15s,border-color .15s}
.deal-card:hover{transform:translateY(-2px);border-color:#BABCC7;box-shadow:0 8px 18px rgba(20,23,18,.08)}
.deal-card.dragging{opacity:.45;transform:rotate(1.5deg)}
.deal-card.won{border-color:#181A1F;background:#181A1F;color:#fff}
.deal-card.lost{opacity:.6}
.deal-card .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.deal-card h3{margin:14px 0 3px;font:600 15px var(--display);letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deal-card>p{margin:0;color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deal-card footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line2);font-size:13px}
.deal-card footer b{font:600 16px var(--display);letter-spacing:-.02em}
.deal-card footer span{color:var(--faint)}
.deal-card.won p,.deal-card.won footer span{color:#9598A6}
.deal-card.won footer{border-top-color:#2D2E34}
.deal-card.won .avatar{background:#28292F;border-color:#35373F;color:#fff}
.won-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;background:var(--lime);color:var(--ink);font-size:12px;font-weight:700}
.add-card{width:100%;height:42px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px dashed #C1C4CE;border-radius:8px;background:transparent;color:#5E616D;font-size:13px;font-weight:500}
.add-card:hover{border-style:solid;border-color:#A8ABB7;background:#fff;color:var(--ink)}

/* directory */
.dir-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.dir-stats article{min-height:118px;display:flex;flex-direction:column;padding:18px 20px;border:1px solid var(--line);border-radius:10px;background:#fff}
.dir-stats article>span{color:var(--mute);font-size:13px;font-weight:500}
.dir-stats strong{margin:14px 0 6px;font:600 28px/1 var(--display);letter-spacing:-.04em}
.dir-stats small{color:var(--faint);font-size:12px}
.dir-stats article.attention{border-color:#EADED8;background:#FFFDFB}
.dir-stats article.attention strong{color:var(--late)}
.toolbar{min-height:74px;display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.toolbar .ttl{margin-right:auto}
.toolbar h2{margin:0;font:600 17px var(--display);letter-spacing:-.02em}
.toolbar .ttl span{display:block;margin-top:2px;color:var(--faint);font-size:12px}
.field-search{width:260px;max-width:100%;height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#FAFBF8;color:var(--faint)}
.field-search:focus-within{border-color:#838695;background:#fff;box-shadow:0 0 0 3px #F0F1E9}
.field-search input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink);font-size:14px}

/* analytics */
.kpis{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{min-width:0;min-height:164px;padding:20px 22px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;flex-direction:column}
.kpi.dark{background:#181A1F;border-color:#181A1F;color:#fff}
.kpi .h{display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-size:13px}
.kpi.dark .h{color:#9497A4}
.kpi .h em{padding:3px 8px;border-radius:5px;background:#EAF4EE;color:var(--ok);font-size:12px;font-style:normal;font-weight:600}
.kpi.dark .h em{background:rgba(215,255,63,.13);color:var(--lime)}
.kpi strong{display:block;margin:22px 0 16px;font:600 32px/1 var(--display);letter-spacing:-.045em}
.kpi footer{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--faint);font-size:12px}
.kpi footer span{display:flex;align-items:center;gap:6px}
.kpi footer b{color:var(--text);font-weight:600}
.kpi.dark footer b{color:#C2C4CE}
.kpi-progress{height:4px;margin-top:10px;border-radius:2px;background:#2F313A;overflow:hidden}
.kpi-progress i{display:block;height:100%;background:var(--lime)}
.rgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,.75fr);gap:14px;margin-bottom:14px}
.rgrid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:14px;margin-bottom:14px}
.cols-chart{display:flex;gap:12px;padding:22px 24px 20px}
.cols-y{width:44px;display:flex;flex-direction:column;justify-content:space-between;padding-bottom:28px;color:var(--faint);font-size:11px;text-align:right}
.cols-area{flex:1;min-width:0;display:flex;flex-direction:column}
.cols{position:relative;height:220px;display:flex;align-items:flex-end;gap:22px;padding:0 6px;border-bottom:1px solid var(--line2);background-image:linear-gradient(var(--line2) 1px,transparent 1px);background-size:100% 55px;background-position:0 0}
.colb{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.colb .v{font:600 14px var(--display);letter-spacing:-.02em;color:var(--ink2)}
.colb .c{width:100%;max-width:58px;border-radius:5px 5px 0 0;background:#181A1F;min-height:3px}
.colb .c.peak{background:var(--lime);box-shadow:inset 0 0 0 1px #5B61B8}
.colx{display:flex;gap:22px;padding:8px 6px 0;color:var(--faint);font-size:12px}
.colx span{flex:1;text-align:center}
.ring-wrap{position:relative;width:160px;height:160px;display:grid;place-items:center;margin:22px auto 10px}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-wrap circle{fill:none;stroke-width:10}
.ring-wrap>div{position:absolute;display:flex;flex-direction:column;align-items:center}
.ring-wrap strong{font:600 28px var(--display);letter-spacing:-.04em}
.ring-wrap span{color:var(--faint);font-size:12px}
.flist{padding:0 22px}
.flist>div{display:grid;grid-template-columns:1fr auto 44px;align-items:center;min-height:34px;font-size:13px}
.flist span{display:flex;align-items:center;gap:8px;color:var(--text)}
.flist i{width:8px;height:8px;border-radius:2px}
.flist b{font-weight:600}
.flist em{color:var(--faint);font-style:normal;text-align:right}
.rnote{margin:14px 22px 22px}
.frow{display:grid;grid-template-columns:130px minmax(0,1fr) 84px;align-items:center;gap:14px;min-height:56px;padding:0 22px;border-top:1px solid #F0F2ED;font-size:13px;border-radius:0}
.frow:first-of-type{border-top:0}
.frow>div:first-child{display:flex;flex-direction:column;gap:2px}
.frow>div:first-child span{font-weight:600;color:var(--ink2)}
.frow small{color:var(--faint);font-size:12px}
.track{height:8px;border-radius:3px;background:#ECECEF;overflow:hidden}
.track i{display:block;height:100%;border-radius:3px;background:#181A1F;min-width:3px}
.frow b{text-align:right;font-weight:600}
.fsum{display:grid;grid-template-columns:repeat(3,1fr);margin:6px 22px 22px;border:1px solid #E2E3E8;border-radius:8px;background:#F8F9F6}
.fsum div{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-right:1px solid #E2E3E8}
.fsum div:last-child{border:0}
.fsum span{color:var(--faint);font-size:12px}
.fsum b{font:600 18px var(--display);letter-spacing:-.02em}
.fsum b.warn{color:var(--late)}
.attain{display:flex;align-items:center;gap:8px}
.attain>span{height:5px;flex:1;min-width:60px;border-radius:3px;background:#E7E8EC;overflow:hidden}
.attain i{display:block;height:100%;background:#181A1F}
.attain b{width:38px;font-size:13px;color:var(--text)}
.src{display:flex;flex-direction:column;gap:14px;padding:18px 22px 22px}
.src>div{display:grid;grid-template-columns:120px 40px minmax(0,1fr) 110px;align-items:center;gap:12px;font-size:13px}
.src span{color:var(--ink2);font-weight:500}
.src b{font-weight:600}
.src small{color:var(--faint);font-size:12px;text-align:right}
[data-tip]{cursor:default}
[data-tip]:hover .c,[data-tip]:focus .c,[data-tip]:hover .track i,[data-tip]:focus .track i{opacity:.82}
.tip{position:fixed;z-index:80;pointer-events:none;background:#181A1F;color:#fff;padding:8px 12px;border-radius:7px;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .1s;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.tip.show{opacity:1}

/* settings */
.settings td{height:60px;white-space:normal}
.add-field{display:flex;flex-direction:column;gap:14px;padding:22px}
.add-field h3{margin:0;font:600 16px var(--display);letter-spacing:-.02em}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

/* drawer */
.layer{position:fixed;inset:0;z-index:45;background:rgba(19,21,18,.38);animation:fade .18s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:6px;right:6px;bottom:6px;z-index:46;width:min(480px,calc(100% - 12px));overflow-y:auto;border:1px solid #C9CBD4;border-radius:12px;background:#fff;box-shadow:-20px 0 56px rgba(15,17,14,.22);animation:din .22s ease-out;display:flex;flex-direction:column}
@keyframes din{from{opacity:0;transform:translateX(18px)}}
.drawer>header{min-height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 22px;border-bottom:1px solid #E3E4E8;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.drawer>header div{display:flex;gap:6px}
.sq-btn{width:34px;height:34px;display:grid;place-items:center;padding:0;border:1px solid #DEDFE4;border-radius:7px;background:#fff;color:#595C68}
.sq-btn:hover{border-color:#BABCC7;color:var(--ink)}
.hero{display:flex;align-items:center;gap:14px;padding:22px 22px 16px}
.hero-av{width:54px;height:54px;display:grid;place-items:center;flex-shrink:0;border-radius:10px;background:var(--lime);color:var(--ink);font:700 15px var(--display)}
.hero-av.person{border-radius:50%;background:#DBE5FF;color:#384663}
.hero-av.lead{border-radius:50%;background:#EDE6FF;color:#4F3F86}
.hero-av.deal{background:#181A1F;color:var(--lime)}
.hero>div{flex:1;min-width:0}
.title-in{width:100%;margin-left:-8px;padding:2px 8px;border:1px solid transparent;border-radius:7px;background:transparent;outline:0;font:600 23px var(--display);letter-spacing:-.035em}
.title-in:hover{background:var(--soft)}
.title-in:focus{border-color:#838695;background:#fff;box-shadow:0 0 0 3px #F0F1E9}
.hero p{margin:4px 0 0;color:var(--mute);font-size:13px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;padding:0 22px 20px}
.actions a,.actions button{height:40px;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid #D9DBE1;border-radius:7px;background:#fff;color:#484A54;font-size:13px;font-weight:600}
.actions a:hover,.actions button:hover{border-color:#BABCC7;background:#F7F9F5;color:var(--ink)}
.actions .lime{border-color:#181A1F;background:#181A1F;color:var(--lime)}
.actions .lime:hover{background:#25272E;color:var(--lime)}
.dmetrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin:0 22px 20px;border:1px solid var(--line);border-radius:8px;background:#fff}
.dmetrics div{display:flex;flex-direction:column;gap:6px;padding:13px 14px;border-right:1px solid #E3E4E9}
.dmetrics div:last-child{border:0}
.dmetrics span{color:var(--faint);font-size:12px}
.dmetrics strong{font:600 17px var(--display);letter-spacing:-.02em}
.dsec{padding:18px 22px;border-top:1px solid #E3E4E9}
.dsec h3{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;font:600 14px var(--display)}
.dsec h3 em{min-width:22px;padding:2px 7px;border-radius:5px;background:#ECECEF;color:#646773;font:500 12px 'DM Sans';font-style:normal;text-align:center}
.attr{display:grid;grid-template-columns:128px minmax(0,1fr);align-items:center;gap:8px;min-height:40px}
.attr label{color:var(--faint);font-size:13px}
.in{width:100%;height:36px;padding:0 10px;border:1px solid transparent;border-radius:7px;background:transparent;outline:0;color:var(--ink2);font-size:14px;font-weight:500}
.in:hover{background:var(--soft)}
.in:focus{border-color:#838695;background:#fff;box-shadow:0 0 0 3px #F0F1E9}
.linked{width:100%;display:flex;align-items:center;gap:11px;padding:9px 8px;margin:0 -8px;width:calc(100% + 16px);border:0;border-radius:8px;background:transparent;text-align:left}
.linked:hover{background:var(--soft)}
.linked>div{display:flex;flex:1;flex-direction:column;gap:2px;min-width:0}
.linked b{font-size:14px;font-weight:600;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linked small{color:var(--faint);font-size:12px}
.linked>svg{color:#999CA9;flex-shrink:0}
.dsec .add-card{margin-top:8px}
.drawer>footer{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 18px 14px 22px;border-top:1px solid #E3E4E9;color:var(--faint);font-size:12px}

/* modal */
.mlayer{position:fixed;inset:0;z-index:50;display:grid;place-items:start center;padding:9vh 18px 18px;background:rgba(22,23,19,.44);overflow-y:auto;animation:fade .18s}
.modal{width:min(520px,100%);padding:28px;border:1px solid #D5D6DD;border-radius:12px;background:#fff;box-shadow:0 28px 80px rgba(15,16,13,.25);animation:min .2s ease-out}
.modal.wide{width:min(680px,100%)}
.modal.cmd{width:min(640px,100%);padding:0;overflow:hidden}
@keyframes min{from{opacity:0;transform:translateY(10px) scale(.98)}}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
.mhead h2{margin:8px 0 0;font:600 26px var(--display);letter-spacing:-.04em}
.mbody{display:flex;flex-direction:column;gap:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:7px}
.f label{color:#474954;font-size:13px;font-weight:600}
.req{color:var(--late)}
.fin{width:100%;height:46px;padding:0 13px;border:1px solid #D6D8DE;border-radius:8px;outline:0;background:#FAFBF8;color:var(--ink);font-size:14px}
.fin:focus{border-color:#838695;background:#fff;box-shadow:0 0 0 3px #F0F1E9}
.fin.err{border-color:var(--lateDot);box-shadow:0 0 0 3px rgba(221,100,78,.14)}
.fin.sm{height:38px}
textarea.fin{height:auto;padding:12px 13px;resize:vertical;font:13px ui-monospace,Menlo,monospace}
.hint{margin:0;color:var(--mute);font-size:13px}
.warn{margin:0;color:var(--late);font-size:13px;font-weight:500}
.mfoot{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:22px;padding-top:18px;border-top:1px solid #EAEBEE}
.mfoot .text-button{margin-right:auto}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:34px;border:1.5px dashed #C1C4CE;border-radius:10px;background:var(--paper);cursor:pointer;text-align:center;color:var(--text)}
.drop:hover,.drop:focus-within,.drop.over{border-color:#181A1F;background:#F0F1FB}
.drop b{color:var(--ink);font-size:15px}
.linkish{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:#5B61B8;text-decoration-thickness:2px;text-underline-offset:3px}
.map td{height:54px}
.map th:first-child,.map td:first-child{padding-left:0}
.map th:last-child,.map td:last-child{padding-right:0}
.map th{background:transparent}
.cmdin{display:flex;align-items:center;gap:12px;height:62px;padding:0 20px;border-bottom:1px solid var(--line2);color:var(--faint)}
.cmdin input{flex:1;border:0;outline:0;background:transparent;font-size:17px;color:var(--ink)}
.cmdin kbd{padding:3px 8px;border:1px solid #D7D9DF;border-radius:5px;background:#F5F5F1;color:#858893;font:12px 'DM Sans'}
#cmdres{padding:8px;max-height:60vh;overflow-y:auto}
.cmdsep{padding:10px 12px 6px;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.cmdrow{width:100%;display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border:0;border-radius:8px;background:transparent;text-align:left;font-size:14px}
.cmdrow:hover,.cmdrow:focus{background:var(--soft);outline:0}
.cmdrow .k{margin-left:auto;color:var(--faint);font-size:12px}

.toast{position:fixed;z-index:90;left:50%;bottom:26px;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:9px;background:#181A1F;color:#fff;font-size:14px;box-shadow:0 14px 40px rgba(0,0,0,.22);opacity:0;transform:translate(-50%,15px);pointer-events:none;transition:.22s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* v2: next steps, history, settings */
:root{--amber:#D5A445}
.nostep{color:#9A6F14;font-weight:500}
.clip{display:inline-block;max-width:240px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.stale{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;background:#FBF3E2;color:#8A5E10;font-size:12px;font-weight:600}
.deal-card>p.next,.next{display:flex;align-items:center;gap:6px;margin:12px 0 0;padding:8px 10px;border-radius:7px;background:#F4F6F1;color:var(--ink2)!important;font-size:13px!important;white-space:normal!important}
.next span{flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
.deal-card>p.next{align-items:flex-start}.next svg,.next em{margin-top:1px}
.next em{font-style:normal;color:var(--faint);font-size:12px;white-space:nowrap}
.next svg{flex-shrink:0;color:var(--faint)}
.next.today{background:#EAF4EE}.next.today em{color:var(--ok);font-weight:700}
.next.late{background:#FDF0EC}.next.late em,.next.late svg{color:var(--late);font-weight:700}
.next.none{background:#FBF3E2;color:#8A5E10!important}.next.none svg{color:#B98419}
.task-check.plan{border-style:dashed;border-color:#B98419;color:#B98419}
.task-check:not(.plan):hover{color:#858893}
.nextbox{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 22px 20px;padding:16px 18px;border-radius:10px;background:#181A1F;color:#fff}
.nextbox .eyebrow{color:#9497A4}
.nextbox b{display:block;margin-top:5px;font:600 17px var(--display);letter-spacing:-.02em}
.nextbox small{display:block;margin-top:3px;color:var(--lime);font-size:13px;font-weight:600}
.nextbox.late small{color:#FF9C88}
.nextbox.empty-step b{color:#F5D27A}
.nb-acts{display:flex;gap:6px;flex-shrink:0}
.nextbox .ghost-button{background:transparent;color:#fff;border-color:#35373F}
.nextbox .ghost-button:hover{background:#28292F;color:#fff}
.nextbox .primary-button{background:var(--lime);color:var(--ink);border-color:var(--lime);box-shadow:none}
.nextbox .primary-button:hover{background:#4F55A8}
.composer{display:flex;flex-direction:column;gap:10px}
.composer textarea.fin{font:14px/1.5 'DM Sans',sans-serif}
.composer-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg.sm{align-self:flex-start;flex-wrap:wrap}
.seg.sm button{height:32px;padding:0 10px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{position:relative;display:flex;gap:12px;padding-bottom:16px}
.timeline li:not(:last-child)::before{content:'';position:absolute;left:14px;top:32px;bottom:2px;width:1px;background:var(--line2)}
.t-ic{width:29px;height:29px;display:grid;place-items:center;flex-shrink:0;border-radius:8px;background:var(--soft);color:#494B56}
.t-stage .t-ic{background:#181A1F;color:var(--lime)}
.t-task .t-ic{background:#EAF4EE;color:var(--ok)}
.t-system .t-ic{background:#EDE6FF;color:#4F3F86}
.timeline li>div{min-width:0;padding-top:4px}
.timeline b{font-size:13px;font-weight:600;color:var(--ink2)}
.timeline p{margin:3px 0;color:var(--text);font-size:14px;white-space:pre-wrap;word-break:break-word}
.timeline small{color:var(--faint);font-size:12px}
.date-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.date-row .fin{width:180px}
.chip-btn{height:36px;display:inline-flex;align-items:center;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--text);font-size:13px;font-weight:500;cursor:pointer}
.chip-btn:hover{border-color:#181A1F;color:var(--ink)}
.chip-btn.radio:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.chip-btn.on{background:#181A1F;border-color:#181A1F;color:var(--lime)}
.set-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:20px 22px;border-top:1px solid var(--line2)}
.set-row:first-child{border-top:0}
.set-row>div:first-child{flex:1 1 380px;min-width:0}
.set-row h3{margin:0;font:600 16px var(--display);letter-spacing:-.02em}
.set-row p{margin:5px 0 0;color:var(--mute);font-size:13px;max-width:560px}
.set-row .acts{display:flex;gap:8px;flex-wrap:wrap}
.toast .ok{width:24px;height:24px;display:grid;place-items:center;flex-shrink:0;border-radius:5px;background:var(--lime);color:var(--ink)}
.toast button{margin-left:8px;padding:5px 10px;border:0;border-radius:6px;background:#28292F;color:var(--lime);font-size:13px;font-weight:600}
.toast button:hover{background:#2F323B}
.toast.has-act{pointer-events:auto}

/* v3: calm sidebar */
:root{--faint:#686B77;--side:#EFF0F3;--side-line:#DFE0E5}
html,body{background:var(--side)}
.sidebar{background:var(--side);color:var(--ink);border-right:0}
.brand{color:var(--ink);font-size:20px;gap:11px;padding-bottom:22px}
.logo-mark{width:32px;height:32px;display:grid;place-items:center;flex-shrink:0;border-radius:9px;background:#181A1F;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 1px 2px rgba(20,23,18,.18)}
.brand:hover svg{transform:translateX(1px) skewX(-5deg)}
.workspace{border:1px solid var(--side-line);background:#fff;box-shadow:0 1px 2px rgba(20,23,18,.04)}
.workspace-avatar{background:#EEF2E3;color:#3F4A26;border:1px solid #DCE3CB}
.workspace small,.profile small{color:var(--mute)}
.nav-label{color:#727684}
.nav a{color:#454752;font-weight:500}
.nav a svg{color:#727684;transition:color .16s}
.nav a:hover{color:var(--ink);background:#E4E5EA}
.nav a:hover svg{color:var(--ink2)}
.nav a.on{color:var(--ink);background:#fff;box-shadow:0 1px 2px rgba(20,23,18,.06),inset 0 0 0 1px var(--side-line);font-weight:600}
.nav a.on svg{color:var(--ink)}
.nav a.on::before{left:-16px;width:3px;height:20px;border-radius:0 3px 3px 0;background:#181A1F}
.nav em{background:#E2E3E7;color:#545763;font-weight:600}
.nav a.on em{background:#E4E6F7;color:#3D4290}
.target small{color:var(--mute)}
.target>b{color:var(--ink2)}
.progress{background:#DDDEE4}
.progress i{background:linear-gradient(90deg,#181A1F,#32353F)}
.profile{border-top-color:var(--side-line)}
.profile-avatar{background:#E4E8F4;color:#36405A}
.main{border-color:var(--side-line);box-shadow:0 1px 3px rgba(23,24,20,.05),0 8px 30px rgba(23,24,20,.03)}

/* v3: Hermes AI */
.ai-button{height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 10px 0 12px;border:1px solid transparent;border-radius:8px;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(120deg,#8B90DA,#8FD3C1 45%,#A893F0) border-box;color:var(--ink);font-size:14px;font-weight:600;white-space:nowrap;box-shadow:0 2px 10px rgba(143,120,230,.14);transition:box-shadow .16s,transform .16s}
.ai-button:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(143,120,230,.24)}
.ai-spark{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;background:#181A1F;color:var(--lime)}
.ai-button kbd{padding:2px 6px;border:1px solid var(--side-line);border-radius:5px;background:#F7F8F5;color:var(--faint);font:11px 'DM Sans'}
.actions .ask{border-color:transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(120deg,#8B90DA,#8FD3C1 45%,#A893F0) border-box;color:var(--ink)}
.actions .ask svg{color:#5B61B8}
.ai-scrim{z-index:47;background:rgba(19,21,18,.16)}
.ai-panel{position:fixed;top:6px;right:6px;bottom:6px;z-index:48;width:min(460px,calc(100% - 12px));display:flex;flex-direction:column;border:1px solid #C9CBD4;border-radius:12px;background:#FCFCFA;box-shadow:-20px 0 56px rgba(15,17,14,.2);animation:din .22s ease-out;overflow:hidden}
.ai-head{display:flex;align-items:center;gap:12px;padding:14px 16px 14px 18px;border-bottom:1px solid var(--line2);background:#fff}
.ai-head>div:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}
.ai-head b{font:600 16px var(--display);letter-spacing:-.02em}
.ai-head small{color:var(--mute);font-size:12px}
.ai-head-acts{display:flex;gap:6px}
.ai-orb{width:32px;height:32px;display:grid;place-items:center;flex-shrink:0;border-radius:9px;background:#181A1F;color:var(--lime);box-shadow:0 0 0 3px rgba(185,229,42,.18)}
.ai-orb.lg{width:56px;height:56px;border-radius:16px;box-shadow:0 0 0 6px rgba(185,229,42,.14),0 10px 30px rgba(143,120,230,.25)}
.ai-body{flex:1;overflow-y:auto;padding:22px 18px;display:flex;flex-direction:column;gap:16px}
.ai-hello{margin:auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 10px}
.ai-hello h3{margin:8px 0 0;font:600 24px var(--display);letter-spacing:-.035em}
.ai-hello p{margin:0;color:var(--mute);max-width:330px;font-size:14px}
.ai-msg{display:flex;gap:10px;align-items:flex-start}
.ai-msg.u{justify-content:flex-end}
.ai-msg.u .ai-bubble{max-width:85%;padding:10px 14px;border-radius:12px 12px 4px 12px;background:#ECEFE8;color:var(--ink);white-space:pre-wrap;font-size:14px}

.ai-msg.a .ai-bubble{flex:1;min-width:0;color:var(--ink2);font-size:14px;line-height:1.55}
.ai-bubble p{margin:0 0 8px}
.ai-bubble ul,.ai-bubble ol{margin:0 0 10px;padding-left:18px}
.ai-bubble li{margin:5px 0}
.ai-link{display:inline-flex;align-items:center;gap:3px;margin-left:4px;padding:1px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink2);font-size:12px;font-weight:600;vertical-align:1px}
.ai-link:hover{border-color:#181A1F;color:var(--ink)}
.ai-draft{margin:6px 0 10px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:#fff}
.ai-draft b{display:block;margin-bottom:8px;font-size:13px}
.ai-draft pre{margin:0;white-space:pre-wrap;font:14px/1.55 'DM Sans',sans-serif;color:var(--ink2)}
.ai-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ai-acts .chip-btn{height:32px;gap:6px;font-size:12px;font-weight:600}

.ai-err{color:var(--late)}

@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.ai-foot{display:flex;flex-direction:column;gap:10px;padding:12px 16px 14px;border-top:1px solid var(--line2);background:#fff}
.ai-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.ai-chips .chip-btn{flex-shrink:0;height:32px;font-size:12px}
.ai-ctx{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 6px 10px;border-radius:8px;background:#F0F1FB;color:#3D4290;font-size:12px;font-weight:600}
.ai-ctx span{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-ctx button{display:grid;place-items:center;padding:3px;border:0;border-radius:5px;background:transparent;color:inherit}
.ai-ctx button:hover{background:#E4E6F7}
.ai-input{display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 14px;border:1px solid #D6D8DE;border-radius:12px;background:#FAFBF8}
.ai-input:focus-within{border-color:#838695;background:#fff;box-shadow:0 0 0 3px #F0F1E9}
.ai-input textarea{flex:1;min-height:36px;max-height:140px;padding:8px 0;border:0;outline:0;background:transparent;resize:none;font:14px/1.45 'DM Sans',sans-serif;color:var(--ink)}
.ai-send{width:36px;height:36px;display:grid;place-items:center;flex-shrink:0;border:0;border-radius:9px;background:#181A1F;color:var(--lime)}
.ai-send:disabled{opacity:.4;cursor:default}
.ai-note{margin:0;color:var(--mute);font-size:12px;text-align:center}

/* v4: enforced next step */
.done-step{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:9px;background:#EAF4EE;color:#2F6B4F;font-size:14px}
.done-step s{flex:1;min-width:0;text-decoration-thickness:1.5px}
.done-step span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.sugg{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;margin-top:-6px;padding:6px 11px;border:0;border-radius:7px;background:#F0F1FB;color:#3D4290;font-size:13px;font-weight:600}
.sugg svg{color:#5B61B8}
.sugg:hover{background:#E4E6F7}
.close-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:16px;border-top:1px dashed var(--line);color:var(--mute);font-size:13px}
.close-row span{margin-right:4px}
.chip-btn.won{gap:6px}.chip-btn.won:hover{border-color:#4E9F78;background:#F2F8E6;color:#2F6B4F}
.chip-btn.lost{gap:6px}.chip-btn.lost:hover{border-color:#DD644E;background:#FDF0EC;color:var(--late)}
.mfoot .ghost-button+.ghost-button{margin-left:0}

@media (max-width:1180px){
  .metrics,.kpis{grid-template-columns:repeat(2,1fr)}
  .dash-grid,.rgrid,.rgrid2{grid-template-columns:1fr}
  .dir-stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  .sidebar{position:static;width:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 12px;overflow-x:auto}
  .brand{padding:0 6px}.brand>span:last-child,.workspace,.nav-label,.side-bottom,.nav em,.ai-button kbd{display:none}
  .nav{flex-direction:row;margin:0}.nav-label.second{margin:0}
  .main{margin:6px}
  .topbar{padding:0 14px}.search{width:auto;flex:1}.search kbd{display:none}
  .page{padding:26px 16px 40px}
  .page-heading h1{font-size:30px}
  .metrics,.kpis,.dir-stats{grid-template-columns:1fr}
  .form-row,.grid3{grid-template-columns:1fr}
  .attr{grid-template-columns:104px minmax(0,1fr)}
}

const norm = s => String(s ?? '').toLowerCase().replace(/ł/g, 'l').normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const pad = n => String(n).padStart(2, '0');
const isoD = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = n => { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + n); return isoD(d); };
const today = addDays(0);
const thisMonth = today.slice(0, 7);
const nowISO = () => { const d = new Date(); return `${isoD(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const grp = n => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const money = n => grp(n) + ' zł';
const kzl = n => n >= 1000 ? String(Math.round(n / 100) / 10).replace('.', ',') + ' tys.' : grp(n);
const sum = list => list.reduce((a, d) => a + (Number(d.value) || 0), 0);
const plural = (n, one, few, many) => n === 1 ? one : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? few : many;
const pct = (a, b) => b ? Math.round(a / b * 100) : null;
const dayDiff = v => Math.round((new Date(String(v).slice(0, 10) + 'T12:00:00') - new Date(today + 'T12:00:00')) / 864e5);
function fdate(v) {
  if (!v) return '';
  const d = new Date(String(v).slice(0, 10) + 'T12:00:00');
  if (isNaN(d)) return v;
  const o = { day: 'numeric', month: 'short' };
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('pl-PL', o);
}
function rel(v) {
  if (!v) return '';
  const n = dayDiff(v);
  if (n === 0) return 'dziś';
  if (n === 1) return 'jutro';
  if (n === -1) return 'wczoraj';
  if (n > 1 && n < 7) return `za ${n} dni`;
  if (n < -1 && n > -7) return `${-n} dni temu`;
  return fdate(v);
}
function relTime(at) {
  const n = dayDiff(at), t = String(at).slice(11, 16);
  const base = n === 0 ? 'Dziś' : n === -1 ? 'Wczoraj' : fdate(at);
  return t ? `${base}, ${t}` : base;
}
function normDate(v) {
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const m = v.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
  return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : '';
}

function download(name, content, type) {

  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

  if (!s || typeof s !== 'object' || !s.db) return false;
  for (const o of [...OBJS, 'activity']) db[o] = Array.isArray(s.db[o]) ? s.db[o] : [];

  for (const o of OBJS) {

    SCHEMA[o].fields = SCHEMA[o].fields.filter(f => f.core).concat(custom);

    SCHEMA[o].fields.forEach(f => { if (lab[f.key]) f.label = lab[f.key]; });

function sparkPath(vals) {
  const max = Math.max(1, ...vals), n = vals.length - 1;
  const pts = vals.map((v, i) => [i / n * 400, 64 - v / max * 54]);
  return pts.map((p, i) => {
    if (!i) return `M${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
    const q = pts[i - 1], cx = (q[0] + p[0]) / 2;
    return `C${cx.toFixed(1)} ${q[1].toFixed(1)} ${cx.toFixed(1)} ${p[1].toFixed(1)} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
  }).join(' ');
}

/* ================= modals ================= */
let modalLock = false;
function modal(html, cls = '', opts = {}) {
  modalLock = !!opts.lock;
  $('#modalLayer').innerHTML = `<div class="mlayer"><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
}
function closeModal() { $('#modalLayer').innerHTML = ''; imp = null; modalLock = false; }
const isModal = () => !!$('#modalLayer').innerHTML;
const mhead = (eyebrow, title, lock) => `<div class="mhead"><div><p class="eyebrow">${eyebrow}</p><h2>${title}</h2></div>${lock ? '' : `<button type="button" class="sq-btn" data-act="close-modal" aria-label="Zamknij">${ic('close', 17)}</button>`}</div>`;

function openAdd(obj, preset = {}) {
  const S = SCHEMA[obj];
  const fs = S.fields.filter(f => (f.quick || f.req) && !f.onlyLost);
  const hidden = Object.keys(preset).filter(k => !fs.some(f => f.key === k));
  const [first, ...rest] = fs;
  const pairs = []; for (let i = 0; i < rest.length; i += 2) pairs.push(rest.slice(i, i + 2));
  const need = f => f.req || (obj === 'deal' && f.key === 'nextStep');
  const fl = f => `<div class="f"><label for="n-${f.key}">${esc(f.label)}${need(f) ? ' <span class="req" aria-hidden="true">*</span>' : ''}</label>${control(f, preset[f.key] ?? (f.key === 'stage' ? 'Nowe' : f.key === 'nextDate' ? addDays(3) : ''), 'form', obj)}</div>`;
  modal(`<form id="addForm" data-obj="${obj}" novalidate>
    ${mhead(`Nowy rekord · ${S.one}`, `Dodaj ${S.gen}`)}
    <div class="mbody">${fl(first)}${pairs.map(p => p.length === 2 ? `<div class="form-row">${p.map(fl).join('')}</div>` : fl(p[0])).join('')}
      ${hidden.map(k => `<input type="hidden" name="${k}" value="${esc(preset[k])}">`).join('')}
      <p class="hint" id="addErr" role="alert">${obj === 'deal' ? 'Każda otwarta szansa musi mieć następny krok. Resztę uzupełnisz w karcie.' : 'Pozostałe pola uzupełnisz w karcie rekordu.'}</p></div>
    <div class="mfoot"><button type="button" class="ghost-button" data-act="close-modal">Anuluj</button><button type="submit" class="primary-button">Utwórz ${ic('arrow', 16)}</button></div>
  </form>`);
  setTimeout(() => $('#n-name') && $('#n-name').focus(), 0);
}

let stepCtx = null;
function openNextStep(id, title, mode = 'edit', meta = {}) {
  const d = find('deal', id); if (!d) return;
  if (mode === 'complete' && !d.nextStep) mode = 'new';
  stepCtx = { id, mode, ...meta };
  const lock = mode !== 'edit';
  const val = mode === 'complete' ? '' : (d.nextStep || '');
  const date = mode === 'complete' || !d.nextDate || d.nextDate < today ? addDays(mode === 'complete' ? 3 : (d.nextDate && d.nextDate < today ? 0 : 3)) : d.nextDate;
  const sugg = STEP_HINT[d.stage];
  const hint = { complete: 'Zadanie zamknie się dopiero, gdy zaplanujesz kolejny krok — albo zamkniesz szansę.', stage: 'Każda otwarta szansa musi mieć następny krok.', new: 'Każda otwarta szansa musi mieć następny krok.', edit: 'Krok pojawi się na Pulpicie w dniu terminu.' }[mode];
  const foot = {
    complete: `<button type="button" class="ghost-button" data-act="step-cancel">Anuluj</button><button type="submit" class="primary-button">${ic('tick', 16)}Zamknij zadanie i zapisz krok</button>`,
    stage: `<button type="button" class="ghost-button" data-act="step-cancel">Cofnij zmianę etapu</button>${meta.hadStep ? '<button type="button" class="ghost-button" data-act="step-keep">Zostaw obecny krok</button>' : ''}<button type="submit" class="primary-button">Zapisz krok</button>`,
    new: `<button type="submit" class="primary-button">Zapisz krok</button>`,
    edit: `<button type="button" class="ghost-button" data-act="close-modal">Anuluj</button><button type="submit" class="primary-button">Zapisz krok</button>`
  }[mode];
  modal(`<form id="nextForm" data-id="${id}" novalidate>
    ${mhead(esc(dealLabel(d)) + ' · ' + esc(d.stage), esc(title || 'Następny krok'), lock)}

function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0];
  const d = [';', ',', '\t'].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === d) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function loadCSV(text, name) {
  const rows = parseCSV(text);
  if (rows.length < 2) { toast('Nie znaleziono wierszy z danymi'); return; }
  const S = SCHEMA[imp.obj];
  imp.headers = rows[0].map(h => h.trim());
  imp.rows = rows.slice(1).filter(r => r.some(c => String(c).trim()));
  imp.file = name;
  const used = new Set();
  imp.map = imp.headers.map(h => {
    const n = norm(h);
    const f = S.fields.find(f => !used.has(f.key) && [f.label, f.key, ...(ALIAS[f.key] || [])].some(x => norm(x) === n));
    if (f) { used.add(f.key); return f.key; }
    return '';
  });
  imp.step = 2; renderImport();
}
function readFile(file) { const r = new FileReader(); r.onload = () => loadCSV(String(r.result), file.name); r.readAsText(file, 'UTF-8'); }
const isDup = (obj, rec) => db[obj].some(x => (rec.email && x.email && norm(x.email) === norm(rec.email)) || (obj !== 'deal' && norm(x.name) === norm(rec.name)));
function runImport() {
  const obj = imp.obj; let n = 0, dup = 0;
  for (const row of imp.rows) {
    const rec = { id: uid(obj[0]), created: today };
    if (obj === 'deal') { rec.stage = 'Nowe'; rec.owner = 'Kamil K.'; rec.stageAt = today; }
    if (obj === 'lead') rec.status = 'Nowy';
    imp.map.forEach((k, i) => {
      if (!k) return;
      const f = field(obj, k); let v = String(row[i] ?? '').trim();
      if (!v) return;
      if (f.type === 'relation') {
        let t = db[f.to].find(x => norm(x.name) === norm(v));
        if (!t) { t = { id: uid(f.to[0]), name: v, created: today }; db[f.to].push(t); }
        v = t.id;
      } else if (f.type === 'select') { const o = f.options.find(o => norm(o[0]) === norm(v)); if (!o) return; v = o[0]; }
      else if (f.type === 'money' || f.type === 'number') v = parseVal(f, v);
      else if (f.type === 'date') { v = normDate(v); if (!v) return; }
      rec[k] = v;
    });
    if (!rec.name) continue;
    if (isDup(obj, rec)) { dup++; continue; }
    db[obj].push(rec); n++;
  }
  closeModal();
  if (!(state.page === 'pipeline' && obj === 'deal')) { state.page = 'list'; state.obj = obj; state.q = ''; }
  render();
  toast(`Zaimportowano ${n} ${plural(n, 'rekord', 'rekordy', 'rekordów')}${dup ? ` · pominięto ${dup} ${plural(dup, 'duplikat', 'duplikaty', 'duplikatów')}` : ''}`);
}

function md(t) {
  const lines = esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').split('\n');
  let out = '', list = false;
  for (const ln of lines) {
    const m = ln.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if (m) { if (!list) { out += '<ul>'; list = true; } out += `<li>${m[1]}</li>`; continue; }
    if (list) { out += '</ul>'; list = false; }
    const h = ln.match(/^#{1,4}\s+(.*)/);
    out += h ? `<p><b>${h[1]}</b></p>` : (ln.trim() ? `<p>${ln}</p>` : '');
  }
  return out + (list ? '</ul>' : '');
}

async function callClaude() {
  const c = ctxRec();
  const system = `Jesteś Hermes — asystentem AI wbudowanym w CRM dla foundera, który sam sprzedaje (B2B, Polska). Odpowiadasz po polsku, krótko i konkretnie, jak doświadczony handlowiec. Opierasz się wyłącznie na danych CRM poniżej; jeśli czegoś w nich nie ma, mówisz to wprost i niczego nie wymyślasz. Kwoty podajesz w zł. Proponując działania, podajesz konkretny następny krok z terminem. Wiadomości e-mail piszesz gotowe do wysłania, w formie „Pan/Pani”, podpisane „Kamil”. Używasz krótkich list i oszczędnych **pogrubień**.${c ? `\nUżytkownik ma teraz otwarty rekord — ${ctxLabel()}. Pytania bez podanej nazwy dotyczą tego rekordu.` : ''}\n\nDane CRM (JSON):\n${JSON.stringify(crmContext())}`;
  const messages = [];
  for (const m of ai.msgs) {
    const role = m.role === 'user' ? 'user' : 'assistant';
    const content = m.role === 'user' ? m.text : (m.text || m.html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim());
    if (!content) continue;
    if (messages.length && messages[messages.length - 1].role === role) messages[messages.length - 1].content += '\n\n' + content;
    else messages.push({ role, content });
  }
  while (messages.length && messages[0].role !== 'user') messages.shift();
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-api-key': aiCfg.key, 'anthropic-version': '2026-10-21', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: aiCfg.model || 'claude-sonnet-5-5', max_tokens: 1200, system, messages: messages.slice(-14) })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data.error && data.error.message) || `HTTP ${res.status}`);
  return (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim() || '(pusta odpowiedź)';
}

function findMentioned(q) {

}
function logEntry() {
  const ta = $('#act-text'); if (!ta || !openRec) return;
  const text = ta.value.trim();
  if (!text) { ta.classList.add('err'); ta.focus(); return; }
  logAct(openRec.obj, openRec.id, state.atype, text);
  renderDrawer(); renderSide(); renderMain();
  toast(`Dodano do historii: ${ACT[state.atype][0].toLowerCase()}`);
}

document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('mlayer')) { if (!modalLock) closeModal(); return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (t.tagName === 'A') e.preventDefault();
  switch (a) {
    case 'go':
      state.page = t.dataset.page; if (t.dataset.obj) state.obj = t.dataset.obj; state.q = '';
      openRec = null; renderDrawer(); render(); window.scrollTo(0, 0); break;
    case 'open':
      if (isModal()) closeModal();
      if (t.closest('#aiLayer')) { ai.open = false; renderAI(); }
      openRec = { obj: t.dataset.obj, id: t.dataset.id }; state.allActs = false; renderDrawer();
      setTimeout(() => { const b = $('.drawer .sq-btn'); if (b) b.focus(); }, 0); break;
    case 'close-drawer': openRec = null; renderDrawer(); break;
    case 'add': {
      const preset = {};
      if (t.dataset.stage) preset.stage = t.dataset.stage;
      if (t.dataset.pk) preset[t.dataset.pk] = t.dataset.pid;
      openAdd(t.dataset.obj, preset); break;
    }
    case 'import': openImport(t.dataset.obj); break;
    case 'export': exportCSV(t.dataset.obj); break;
    case 'close-modal': closeModal(); break;
    case 'cmdk': openCmd(); break;
    case 'convert': convertLead(); break;
    case 'lost': state.showLost = !state.showLost; renderPipeline(); break;
    case 'nextstep': openNextStep(t.dataset.id); break;
    case 'step-sugg': stepAction('sugg', t); break;
    case 'step-keep': stepAction('keep', t); break;
    case 'step-cancel': stepAction('cancel', t); break;
    case 'step-won': stepAction('won', t); break;
    case 'step-lost': stepAction('lost', t); break;
    case 'qdate': { const i = $('#ns-date'); if (i) i.value = t.dataset.d; break; }
    case 'done': {
      const k = t.dataset.kind, id = t.dataset.id;
      if (k === 'step') completeStep(id);
      else if (k === 'nostep') openNextStep(id, 'Ustal następny krok');
      else if (k === 'lead') {
        const l = find('lead', id); if (!l) break;
        l.status = 'W kontakcie'; logAct('lead', id, 'task', 'Pierwszy kontakt wykonany');
        render(); refreshDrawer(); toast(`${l.name} → W kontakcie`);
      }
      break;
    }
    case 'atype': {
      state.atype = t.dataset.t;
      document.querySelectorAll('[data-act="atype"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === state.atype)));
      const ta = $('#act-text'); if (ta) { ta.placeholder = ACT_PH[state.atype]; ta.focus(); }
      break;
    }
    case 'log': logEntry(); break;
    case 'allacts': state.allActs = true; renderDrawer(); break;
    case 'toast-act': { const fn = toastFn; toastFn = null; $('#toast').classList.remove('show'); if (fn) fn(); break; }
    case 'del': deleteRecord(); break;
    case 'ai': ai.open ? closeAI() : openAI(openRec ? { ...openRec } : ai.ctx); break;
    case 'ai-rec': openAI({ ...openRec }); break;
    case 'ai-close': closeAI(); break;
    case 'ai-ask': askAI(t.dataset.q); break;
    case 'ai-clear': ai.msgs = []; ai.drafts = {}; renderAI(); break;
    case 'ai-ctx-x': ai.ctx = null; renderAI(); break;
    case 'ai-setup': ai.open = false; renderAI(); state.page = 'settings'; state.settingsObj = 'general'; openRec = null; renderDrawer(); render(); setTimeout(() => { const i = $('[data-setting="aiKey"]'); if (i) i.focus(); }, 0); break;
    case 'ai-forget': aiCfg.key = ''; saveAiCfg(); renderSettings(); toast('Usunięto klucz API — Hermes AI działa lokalnie'); break;
    case 'ai-copy': { const dr = ai.drafts[t.dataset.k]; if (!dr) break; const txt = `Temat: ${dr.subject}\n\n${dr.body}`; (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Skopiowano szkic do schowka')).catch(() => toast('Nie udało się skopiować — zaznacz tekst ręcznie')); break; }
    case 'ai-log': { const dr = ai.drafts[t.dataset.k]; if (!dr) break; logAct(dr.obj, dr.id, 'email', `Wysłano: ${dr.subject}`); renderSide(); renderMain(); refreshDrawer(); t.disabled = true; t.innerHTML = ic('tick', 14) + 'Zapisano w historii'; toast('Zapisano e-mail w historii'); break; }
    case 'ai-setstep': { const d = find('deal', t.dataset.id); if (!d) break; d.nextStep = t.dataset.text; d.nextDate = t.dataset.d; render(); refreshDrawer(); t.disabled = true; t.innerHTML = ic('tick', 14) + 'Ustawiono'; toast(`Następny krok: ${rel(d.nextDate)}`); break; }
    case 'stab': state.settingsObj = t.dataset.obj; renderSettings(); break;
    case 'del-field': {
      if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'Na pewno?'; return; }
      const S = SCHEMA[state.settingsObj], f = field(state.settingsObj, t.dataset.key);
      S.fields = S.fields.filter(x => x.key !== t.dataset.key);
      renderSettings(); save(); toast(`Usunięto pole: ${f.label}`); break;
    }
    case 'aowner': state.aOwner = t.dataset.v; renderAnalytics(); break;
    case 'tmpl': downloadTemplate(); break;
    case 'backup': download(`hermes-kopia-${today}.json`, JSON.stringify(snapshot(), null, 2), 'application/json'); toast('Pobrano kopię zapasową'); break;
    case 'demo': {
      if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'Nadpisać obecne dane?'; return; }
      const prev = JSON.parse(JSON.stringify(snapshot()));
      const fresh = demoData(); for (const o of [...OBJS, 'activity']) db[o] = fresh[o];
      render(); toast('Przywrócono dane demo', { label: 'Cofnij', fn: () => { applyState(prev); render(); toast('Przywrócono poprzednie dane'); } });
      break;
    }
    case 'wipe': {
      if (!t.dataset.armed) { t.dataset.armed = '1'; t.innerHTML = ic('trash', 16) + 'Na pewno? Kliknij ponownie'; return; }
      const prev = JSON.parse(JSON.stringify(snapshot()));
      for (const o of [...OBJS, 'activity']) db[o] = [];
      render(); toast('Wyczyszczono wszystkie dane', { label: 'Cofnij', fn: () => { applyState(prev); render(); toast('Przywrócono dane'); } });
      break;
    }
    case 'imp-paste': {
      const v = $('#csvpaste').value;
      if (!v.trim()) { toast('Wybierz plik albo wklej dane'); return; }
      loadCSV(v, null); break;
    }
    case 'imp-back': imp.step = 1; renderImport(); break;
    case 'imp-run': runImport(); break;
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const form = e.target, fd = new FormData(form);
  if (form.id === 'aiForm') { const i = $('#ai-input'); const q = i.value; i.value = ''; askAI(q); return; }
  if (form.id === 'addForm') {
    const obj = form.dataset.obj, S = SCHEMA[obj];
    const rec = { id: uid(obj[0]), created: today };
    if (obj === 'deal') { rec.stage = 'Nowe'; rec.owner = 'Kamil K.'; rec.stageAt = today; rec.nextStep = ''; rec.nextDate = ''; }
    if (obj === 'lead') rec.status = 'Nowy';
    for (const f of S.fields) { const v = fd.get(f.key); if (v !== null && String(v).trim() !== '') rec[f.key] = parseVal(f, v); }
    const err = $('#addErr');
    if (!rec.name) {
      const i = $('#n-name'); i.classList.add('err'); i.setAttribute('aria-invalid', 'true'); i.focus();
      err.className = 'warn'; err.textContent = `Podaj: ${field(obj, 'name').label.toLowerCase()}.`;
      return;
    }
    if (isDup(obj, rec) && !form.dataset.force) {
      form.dataset.force = '1';
      err.className = 'warn'; err.textContent = `Taki rekord już istnieje (${rec.email ? "ten sam e-mail lub ta sama nazwa" : "ta sama nazwa"}). Kliknij „Utwórz” ponownie, aby dodać mimo to.`;
      return;
    }
    if (obj === 'deal' && !CLOSED.includes(rec.stage) && !rec.nextStep) {
      const i = $('#n-nextStep'); if (i) { i.classList.add('err'); i.setAttribute('aria-invalid', 'true'); i.focus(); }
      err.className = 'warn'; err.textContent = 'Każda otwarta szansa potrzebuje następnego kroku — co i kiedy zrobisz?';
      return;
    }
    if (obj === 'deal' && rec.nextStep && !rec.nextDate) rec.nextDate = addDays(3);
    if (obj === 'deal' && CLOSED.includes(rec.stage)) rec.closedAt = today;
    db[obj].unshift(rec);
    if (obj === 'deal') logAct('deal', rec.id, 'system', `Utworzono szansę w etapie: ${rec.stage}`);
    closeModal(); render(); refreshDrawer();
    toast(`Dodano: ${rec.name}`, { label: 'Otwórz', fn: () => { openRec = { obj, id: rec.id }; state.allActs = false; renderDrawer(); } });
  }
  if (form.id === 'nextForm') {
    const d = find('deal', form.dataset.id), text = String(fd.get('text') || '').trim();
    if (!text) { $('#ns-text').classList.add('err'); $('#ns-text').focus(); const er = $('#nsErr'); er.className = 'warn'; er.textContent = 'Opisz krok w kilku słowach.'; return; }
    const mode = stepCtx && stepCtx.id === d.id ? stepCtx.mode : 'edit';
    if (mode === 'complete') logAct('deal', d.id, 'task', d.nextStep || 'Następny krok');
    d.nextStep = text; d.nextDate = fd.get('date') || addDays(3);
    stepCtx = null;
    closeModal(); render(); refreshDrawer();
    toast(mode === 'complete' ? `Zadanie zamknięte · kolejny krok ${rel(d.nextDate)}` : `Następny krok: ${rel(d.nextDate)}`);
  }
  if (form.id === 'lostForm') {
    const d = find('deal', form.dataset.id), reason = fd.get('reason'), note = String(fd.get('note') || '').trim();
    if (!reason) { const er = $('#lostErr'); er.className = 'warn'; er.textContent = 'Wybierz powód — to ważna wiedza na przyszłość.'; return; }
    d.lostReason = reason;
    if (note) logAct('deal', d.id, 'note', note);
    closeModal(); render(); refreshDrawer();
    toast(`Zapisano powód: ${reason}`);
  }
  if (form.id === 'fieldForm') {
    const label = String(fd.get('label') || '').trim(), type = fd.get('type');
    if (!label) { $('#nf-label').classList.add('err'); $('#nf-label').focus(); return; }
    const f = { key: 'cf' + Date.now().toString(36), label, type };
    if (type === 'select') {
      const opts = String(fd.get('options') || '').split(',').map(s => s.trim()).filter(Boolean);
      if (!opts.length) { $('#nf-opt').classList.add('err'); $('#nf-opt').focus(); toast('Podaj opcje listy, oddzielone przecinkami'); return; }
      f.options = opts.map((o, i) => [o, CYCLE[i % CYCLE.length]]);
    }
    SCHEMA[state.settingsObj].fields.push(f);
    renderSettings(); save(); toast(`Dodano pole: ${label}`);
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.edit && openRec) {
    const r = find(openRec.obj, openRec.id), f = field(openRec.obj, t.dataset.edit);
    const v = parseVal(f, t.value);
    if (f.key === 'name' && !v) { t.value = r.name; return; }
    if (openRec.obj === 'deal' && f.key === 'stage') { setStage(r, v); return; }
    r[f.key] = v;
    const sub = $('#hero-sub'); if (sub) sub.textContent = subtitle(openRec.obj, r) || ' ';
    renderSide(); renderMain();
    return;
  }
  if (t.dataset.map !== undefined && imp) { imp.map[+t.dataset.map] = t.value; renderImport(); return; }
  if (t.dataset.fl) {
    const f = field(state.settingsObj, t.dataset.fl);
    if (t.value.trim()) { f.label = t.value.trim(); save(); toast('Zapisano nazwę pola'); } else t.value = f.label;
    return;
  }
  if (t.dataset.setting === 'aiKey') {
    const v = t.value.trim();
    if (!v || v.includes('•')) return;
    aiCfg.key = v; saveAiCfg(); renderSettings(); toast('Połączono Hermes AI z Claude API');
    return;
  }
  if (t.dataset.setting === 'aiModel') { aiCfg.model = t.value.trim() || 'claude-sonnet-5-5'; saveAiCfg(); toast(`Model: ${aiCfg.model}`); return; }
  if (t.dataset.setting === 'target') {
    const v = Number(String(t.value).replace(/[^\d]/g, ''));
    if (v > 0) { settings.target = v; t.value = grp(v); renderSide(); save(); toast(`Cel miesiąca: ${money(v)}`); } else t.value = grp(settings.target);
    return;
  }
  if (t.name === 'reason') { document.querySelectorAll('.chip-btn.radio').forEach(l => l.classList.toggle('on', l.querySelector('input').checked)); return; }
  if (t.id === 'csvfile' && t.files[0]) readFile(t.files[0]);
  if (t.id === 'backupfile' && t.files[0]) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const s = JSON.parse(String(rd.result));
        if (s.app !== 'hermes-crm' || !applyState(s)) throw new Error('bad');
        openRec = null; renderDrawer(); render(); toast('Wczytano kopię zapasową');
      } catch (err) { toast('To nie jest poprawna kopia Hermesa'); }
    };
    rd.readAsText(t.files[0], 'UTF-8');
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.role === 'q') { state.q = t.value; renderRows(); }
  else if (t.dataset.role === 'cmdq') renderCmd(t.value);
  else if (t.id === 'ai-input') { t.style.height = 'auto'; t.style.height = Math.min(140, t.scrollHeight) + 'px'; }
  else if (t.classList.contains('err')) t.classList.remove('err');
});

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmd(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'j') { e.preventDefault(); ai.open ? closeAI() : openAI(openRec ? { ...openRec } : ai.ctx); return; }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'ai-input') { e.preventDefault(); const f = $('#aiForm'); if (f) f.requestSubmit ? f.requestSubmit() : f.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true })); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && e.target.id === 'act-text') { e.preventDefault(); logEntry(); return; }
  if (e.key === 'Escape') { if (isModal()) { if (!modalLock) closeModal(); } else if (ai.open) closeAI(); else if (openRec) { openRec = null; renderDrawer(); } return; }
  if (e.key === 'Enter' && e.target.id === 'cmdq') { const b = $('#cmdres .cmdrow'); if (b) b.click(); return; }
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
  if (e.key === 'Enter' && e.target.classList.contains('deal-card')) { e.target.click(); return; }
  if (e.key === 'n' && !e.metaKey && !e.ctrlKey && !isModal()) { e.preventDefault(); openAdd(addTarget()[0]); }
});

/* chart tooltips */
const tip = $('#tip');
function showTip(el, x, y) {
  tip.textContent = el.dataset.tip; tip.classList.add('show');
  const w = tip.offsetWidth;
  tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x - w / 2)) + 'px';
  tip.style.top = Math.max(8, y - 46) + 'px';
}
document.addEventListener('mousemove', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) showTip(el, e.clientX, e.clientY); else tip.classList.remove('show');
});
document.addEventListener('focusin', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top); } else tip.classList.remove('show');
});

/* drag & drop: kanban + CSV */
document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('.deal-card'); if (!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging');
});
document.addEventListener('dragend', () => document.querySelectorAll('.dragging,.over').forEach(x => x.classList.remove('dragging', 'over')));
document.addEventListener('dragover', e => {
  const col = e.target.closest && e.target.closest('.kcol'), drop = e.target.closest && e.target.closest('.drop');
  if (!col && !drop) return;
  e.preventDefault();
  const el = col || drop;
  document.querySelectorAll('.over').forEach(x => x !== el && x.classList.remove('over'));
  el.classList.add('over');
});
document.addEventListener('drop', e => {
  const drop = e.target.closest && e.target.closest('.drop');
  if (drop) { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) readFile(f); return; }
  const col = e.target.closest && e.target.closest('.kcol'); if (!col) return;
  e.preventDefault();
  col.classList.remove('over');
  const d = find('deal', e.dataTransfer.getData('text/plain'));
  if (d) setStage(d, col.dataset.stage);
});

load();
render();

</script>
</body>
</html>
