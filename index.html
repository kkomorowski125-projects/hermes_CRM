function sparkPath(vals) {
  const max = Math.max(1, ...vals), n = vals.length - 1;
  const pts = vals.map((v, i) => [i / n * 400, 64 - v / max * 54]);
  return pts.map((p, i) => {
    if (!i) return `M${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
    const q = pts[i - 1], cx = (q[0] + p[0]) / 2;
    return `C${cx.toFixed(1)} ${q[1].toFixed(1)} ${cx.toFixed(1)} ${p[1].toFixed(1)} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
  }).join(' ');
}
function wonByMonth(deals, n = 6) {
  const out = [];

    const k = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;

  }
  return out;
}

  if (p.type === 'month') return cap(dm(f, short ? { month: 'short', year: '2-digit' } : { month: 'long', year: 'numeric' }));
  if (p.type === 'quarter') return `Q${Math.floor(f.getMonth() / 3) + 1} ${short ? String(f.getFullYear()).slice(2) : f.getFullYear()}`;

function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0];
  const d = [';', ',', '\t'].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === d) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function loadCSV(text, name) {
  const rows = parseCSV(text);
  if (rows.length < 2) { toast('Nie znaleziono wierszy z danymi'); return; }
  const S = SCHEMA[imp.obj], rec = imp.obj === 'lead' || imp.obj === 'deal';
  imp.headers = rows[0].map(h => h.trim());
  imp.rows = rows.slice(1).filter(r => r.some(c => String(c).trim()));
  imp.file = name;
  const used = new Set();
  const cands = rec ? [...EXTRA.map(e => ({ key: e.key, names: [e.label, ...e.alias] })), ...S.fields.map(f => ({ key: f.key, names: [f.label, f.key, ...(ALIAS[f.key] || [])] }))]
    : S.fields.map(f => ({ key: f.key, names: [f.label, f.key, ...(ALIAS[f.key] || [])] }));
  imp.map = imp.headers.map(h => {
    const n = norm(h);
    const f = cands.find(c => !used.has(c.key) && c.names.some(x => norm(x) === n));
    if (f) { used.add(f.key); return f.key; }
    return '';
  });
  imp.step = 2; renderImport();
}
function readFile(file) { const r = new FileReader(); r.onload = () => loadCSV(String(r.result), file.name); r.readAsText(file, 'UTF-8'); }
const isDup = (obj, rec) => db[obj].some(x => (rec.email && x.email && norm(x.email) === norm(rec.email)) || (obj !== 'deal' && norm(x.name) === norm(rec.name) && (obj !== 'lead' || isOpenLead(x))));
function runImport() {
  const obj = imp.obj; let n = 0, dup = 0;
  const rec1 = obj === 'lead' || obj === 'deal';
  for (const row of imp.rows) {
    const rec = { id: uid(obj[0]), created: today }, ex = {};
    if (obj === 'deal') { rec.stage = 'Nowe'; rec.owner = me(); rec.stageAt = today; rec.contacts = []; rec.nextStep = ''; rec.nextDate = ''; }
    if (obj === 'lead') { rec.status = 'Nowy'; rec.statusAt = today; rec.owner = me(); rec.contacts = []; rec.nextStep = ''; rec.nextDate = ''; }
    imp.map.forEach((k, i) => {
      if (!k) return;
      let v = String(row[i] ?? '').trim();
      if (!v) return;
      if (k[0] === '_') { ex[k] = v; return; }
      const f = field(obj, k); if (!f) return;
      if (f.type === 'relation') v = f.to === 'company' ? resolveCompany(v) : (db[f.to].find(x => norm(x.name) === norm(v)) || {}).id || '';
      else if (f.type === 'select') { const o = f.options.find(o => norm(o[0]) === norm(v)); if (!o) return; v = o[0]; }
      else if (f.type === 'money' || f.type === 'number') v = parseVal(f, v);
      else if (f.type === 'date') { v = normDate(v); if (!v) return; }
      rec[k] = v;
    });
    if (rec1) {

}

function md(t) {
  const lines = esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').split('\n');

  for (const ln of lines) {
    const m = ln.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if (m) { if (!list) { out += '<ul>'; list = true; } out += `<li>${m[1]}</li>`; continue; }

    const h = ln.match(/^#{1,4}\s+(.*)/);

  }
  return out + (list ? '</ul>' : '');
}

/* typography: keep one-letter words and short prepositions with the next word, numbers with units */
const NB_SKIP = new Set(['SCRIPT', 'STYLE', 'TEXTAREA', 'PRE', 'INPUT', 'OPTION', 'SELECT']);
const NB_RE = /(^|[\s(„"])([aiouwzAIOUWZ]|do|na|od|po|za|ze|we|że|bo|co|to|nie|Do|Na|Od|Po|Za|Ze|We|Że|Bo|Co|To|Nie)\s+(?=\S)/g;
const NB_NUM = /(\d)\s(?=(\d{3}\b|zł|dni|dnia|dzień|tys\.|%|min|h\b|lead|szans|rekord|krok|wpis|osob|rzecz))/g;
function nbspText(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentNode && !NB_SKIP.has(n.parentNode.nodeName) && /\s/.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
  for (let n; (n = w.nextNode());) {
    const v = n.nodeValue.replace(NB_RE, '$1$2 ').replace(NB_RE, '$1$2 ').replace(NB_NUM, '$1 ');
    if (v !== n.nodeValue) n.nodeValue = v;
  }
}
new MutationObserver(ms => { for (const m of ms) { if (m.type === 'characterData') continue; m.addedNodes.forEach(n => { if (n.nodeType === 1) nbspText(n); else if (n.nodeType === 3 && n.parentNode) nbspText(n.parentNode); }); } }).observe(document.body, { childList: true, subtree: true });
nbspText(document.body);

const AUDIT_TXT = { login: 'Logowanie', org_created: 'Założenie konta firmy', record_created: 'Utworzenie', record_updated: 'Zmiana', record_deleted: 'Usunięcie', export: 'Eksport kopii danych', import: 'Import kopii danych', gdpr_export: 'Eksport danych osoby (RODO)', gdpr_erase: 'Usunięcie danych osoby (RODO)', invite_created: 'Zaproszenie', invite_accepted: 'Przyjęcie zaproszenia', member_updated: 'Zmiana uprawnień', member_removed: 'Usunięcie z zespołu', reset_link_created: 'Link do zmiany hasła', '2fa_enabled': 'Włączenie weryfikacji dwuetapowej', '2fa_disabled': 'Wyłączenie weryfikacji dwuetapowej', ai_first_use_today: 'Pierwsze dziś zapytanie do Hermes AI', identity_linked: 'Połączenie konta logowania', identity_unlinked: 'Odłączenie konta logowania' };
function auditText(a) {
  let d = a.detail; try { d = typeof d === 'string' ? JSON.parse(d) : d; } catch (e) { d = null; }
  const what = AUDIT_TXT[a.action] || a.action;
  const obj = a.type && SCHEMA[a.type] ? SCHEMA[a.type].one.toLowerCase() : '';
  const name = d && (d.name || d.email) ? `: ${d.name || d.email}` : '';
  return `${what}${obj ? ' · ' + obj : ''}${name}`;
}

async function srvAction(a, t) {
  try {
    switch (a) {
      case 'auth-mode': AUTH.mode = t.dataset.m; AUTH.err = ''; AUTH.msg = ''; AUTH.link = ''; AUTH.code = false; renderAuth(); return;
      case 'srv-logout': await api('/api/auth/logout', 'POST', {}); location.replace(location.pathname); return;
      case 'srv-copy': { const i = $(t.dataset.src); if (!i) return; i.select(); try { await navigator.clipboard.writeText(i.value); } catch (e) { document.execCommand && document.execCommand('copy'); } toast('Skopiowano link'); return; }
      case 'srv-2fa-on': SRV.totp = await api('/api/auth/2fa/setup', 'POST', {}); renderSettings(); setTimeout(() => { const i = $('#srv-otp'); if (i) i.focus(); }, 0); return;
      case 'srv-2fa-cancel': SRV.totp = null; renderSettings(); return;
      case 'srv-2fa-off': {
        if (!t.dataset.armed) { t.dataset.armed = '1'; t.outerHTML = `<form id="srvTotpOff" class="srv-inline" novalidate><label class="sr" for="srv-off-p">Hasło</label><input class="fin" id="srv-off-p" name="password" type="password" placeholder="Potwierdź hasłem" autocomplete="current-password"><button class="ghost-button sm danger" type="submit">Wyłącz</button></form>`; setTimeout(() => $('#srv-off-p').focus(), 0); }
        return;
      }
      case 'srv-mdel': {
        if (!t.dataset.armed) { t.dataset.armed = '1'; t.innerHTML = ic('trash', 15) + 'Na pewno?'; return; }
        const m = SRV.s.members.find(x => x.id === t.dataset.id);
        const r = await api('/api/org/members/' + encodeURIComponent(t.dataset.id), 'DELETE');
        toast(`Usunięto z zespołu: ${m ? m.name : 'osoba'}${r.moved ? `. ${r.moved} ${plural(r.moved, 'rekord przeszedł', 'rekordy przeszły', 'rekordów przeszło')} do Ciebie` : ''}`);
        await srvPoll(); await srvRefreshTeam(); return;
      }
      case 'srv-mreset': {
        const m = SRV.s.members.find(x => x.id === t.dataset.id);
        const r = await api(`/api/org/members/${encodeURIComponent(t.dataset.id)}/reset`, 'POST', {});
        SRV.link = { title: `Link do nowego hasła dla: ${m ? m.name : 'osoby'}${r.sent ? ' wysłany mailem' : ''}.`, note: 'Jest ważny 24 godziny i działa raz.', url: r.link }; renderSettings(); return;
      }

      case 'srv-inv-del': await api('/api/org/invites/' + encodeURIComponent(t.dataset.id), 'DELETE'); toast('Anulowano zaproszenie'); await srvRefreshTeam(); return;

        toast('Pobrano dane osoby'); return;
      }
      case 'srv-gdpr-erase': {
        if (!t.dataset.armed) { t.dataset.armed = '1'; t.innerHTML = ic('trash', 16) + 'Usunąć trwale? Kliknij ponownie'; return; }
        await srvSync();
        const name = nameOf('contact', t.dataset.id);
        const r = await api('/api/gdpr/contacts/' + encodeURIComponent(t.dataset.id), 'DELETE');
        openRec = null; await srvLoad(); srvRender(true);
        toast(`Usunięto dane osoby ${name}. Wpisy w historii: ${r.activities}, powiązania: ${r.links}`); return;

}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'auth-mode' || (SRV.on && a.startsWith('srv-'))) { e.preventDefault(); srvAction(a, t); }
});
document.addEventListener('submit', async e => {
  const f = e.target;
  if (f.id === 'authForm') { e.preventDefault(); return authSubmit(f); }
  if (!SRV.on) return;
  const v = Object.fromEntries(new FormData(f).entries());
  try {
    if (f.id === 'inviteForm') {
      e.preventDefault();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v.email || '').trim())) { const i = $('#iv-email'); i.classList.add('err'); i.focus(); toast('Podaj poprawny adres email'); return; }
      const r = await api('/api/org/invites', 'POST', { email: v.email.trim(), role: v.role });
      SRV.link = r.sent ? { title: `Wysłaliśmy zaproszenie na ${v.email.trim()}.`, note: 'Link jest ważny 7 dni. Możesz go też skopiować i przesłać inną drogą.', url: r.link } : { title: `Zaproszenie dla ${v.email.trim()} jest gotowe.`, note: 'Skopiuj link i wyślij go tej osobie. Jest ważny 7 dni.', url: r.link };
      await srvRefreshTeam(); return;

      f.reset(); toast('Zapisano hasło'); if (SRV.ids && !SRV.ids.hasPassword) { SRV.ids.hasPassword = true; renderSettings(); } return;
    }
    if (f.id === 'srvTotp') {
      e.preventDefault();
      await api('/api/auth/2fa/enable', 'POST', { code: v.code });
      SRV.totp = null; SRV.s.user.totp = true; renderSettings(); toast('Włączono weryfikację dwuetapową'); return;
    }
    if (f.id === 'srvTotpOff') {
      e.preventDefault();
      await api('/api/auth/2fa/disable', 'POST', { password: v.password });

document.addEventListener('change', async e => {

document.addEventListener('visibilitychange', () => { if (!document.hidden) srvPoll(); });
let srvErrs = 0;
window.addEventListener('error', e => {
  if (!SRV.on || srvErrs++ >= 5) return;

window.addEventListener('beforeunload', e => {

async function srvBoot() {
  const P = new URLSearchParams(location.search);
  let r;
  try { r = await fetch('/api/session', { credentials: 'same-origin' }); } catch (e) { return false; }
  const json = (r.headers.get('content-type') || '').includes('json');
  if (!json || (r.status !== 200 && r.status !== 401)) return false;
  SRV.on = true;
  if (P.get('invite')) { AUTH.token = P.get('invite'); await showAuth('invite'); return true; }
  if (P.get('reset')) { AUTH.token = P.get('reset'); await showAuth('reset'); return true; }
  if (P.get('oauth_signup')) { AUTH.token = P.get('oauth_signup'); history.replaceState(null, '', location.pathname); await showAuth('oauth-signup'); return true; }
  if (P.get('oauth_totp')) { AUTH.token = P.get('oauth_totp'); history.replaceState(null, '', location.pathname); await showAuth('oauth-totp'); return true; }
  const oerr = P.get('oauth_error'), oinfo = P.get('oauth');
  if (oerr || oinfo) history.replaceState(null, '', location.pathname);
  if (oerr && r.status === 401) { await showAuth('login', '', OAUTH_ERR[oerr] || 'Logowanie nie powiodło się.'); return true; }
  if (r.status === 401) { await showAuth('login'); return true; }
  try { await srvLoad(); } catch (e) { await showAuth('login', e.message); return true; }
  document.body.classList.remove('auth-on');
  state.recent = []; openRec = null;
  srvRender(true);
  api('/api/ai/status').then(u => { SRV.aiUse = u; }).catch(() => {});
  api('/api/me/identities').then(x => { SRV.ids = x; if (state.page === 'settings') renderSettings(); }).catch(() => {});
  if (oinfo === 'linked') { state.page = 'settings'; state.settingsObj = 'general'; render(); toast('Połączono konto logowania'); }
  else if (oerr) toast(OAUTH_ERR[oerr] || 'Logowanie nie powiodło się.');
  SRV.poll = setInterval(srvPoll, 20000);
  return true;
}

const maybeServer = typeof fetch === 'function' && /^https?:$/.test(location.protocol);
if (maybeServer) document.documentElement.classList.add('srv-wait');
load();
syncStages();
render();
if (maybeServer) {
  const ready = () => document.documentElement.classList.remove('srv-wait');
  setTimeout(ready, 4000);
  srvBoot().then(ready, ready);
}
