      toast(`Odłączono firmę: ${nameOf('company', prev)}`, { label: 'Cofnij', fn: () => { R.company = prev; render(); } }); break;
    }
    case 'unlink-contact': {
      if (!R) break; const id = t.dataset.id, i = R.contacts.indexOf(id); if (i < 0) break;
      R.contacts.splice(i, 1); render();
      toast(`Odłączono: ${nameOf('contact', id)}`, { label: 'Cofnij', fn: () => { R.contacts.splice(i, 0, id); render(); } }); break;
    }
    case 'make-primary': {
      if (!R) break; const id = t.dataset.id;
      R.contacts = [id, ...R.contacts.filter(x => x !== id)]; render(); toast(`Główny kontakt: ${nameOf('contact', id)}`); break;
    }
    case 'tlf': { state.tl = t.dataset.v; const r = recCur(), box = $('#rec-tl'); if (r && box) box.innerHTML = recTimeline(state.rec.obj, r); break; }
    case 'act-del': {
      const i = db.activity.findIndex(x => x.id === t.dataset.id); if (i < 0) break;
      const [act] = db.activity.splice(i, 1);
      render(); refreshDrawer();
      toast('Usunięto wpis z historii', { label: 'Cofnij', fn: () => { db.activity.splice(i, 0, act); render(); refreshDrawer(); } }); break;
    }
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const form = e.target, fd = new FormData(form);
  const g = k => String(fd.get(k) || '').trim();
  const fail = (errId, inputId, msg) => { const er = $(errId); if (er) { er.className = 'warn'; er.textContent = msg; } const i = inputId && $(inputId); if (i) { i.classList.add('err'); i.setAttribute('aria-invalid', 'true'); i.focus(); } };
  if (form.id === 'aiForm') { const i = $('#ai-input'); const q = i.value; i.value = ''; askAI(q); return; }
  if (form.id === 'addForm') {
    const obj = form.dataset.obj, S = SCHEMA[obj];
    if (obj === 'lead' || obj === 'deal') {
      const compName = g('_company'), cname = g('_cname');
      const name = obj === 'deal' ? g('name') : (compName || cname);
      if (!name) return obj === 'deal' ? fail('#addErr', '#n-name', 'Podaj nazwę szansy.') : fail('#addErr', '#n-_company', 'Podaj firmę albo osobę kontaktową.');
      if (!g('nextStep')) return fail('#addErr', '#n-nextStep', obj === 'deal' ? 'Każda otwarta szansa potrzebuje następnego kroku — co i kiedy zrobisz?' : 'Każdy lead potrzebuje pierwszego kroku — co i kiedy zrobisz?');
      if (obj === 'lead' && !form.dataset.force && db.lead.some(l => isOpenLead(l) && (norm(l.name) === norm(name) || (compName && norm(nameOf('company', l.company)) === norm(compName))))) {
        form.dataset.force = '1';
        return fail('#addErr', null, 'Ten klient ma już otwartego leada. Kliknij „Utwórz” ponownie, aby dodać mimo to.');
      }
      const pc = g('_contact') ? find('contact', g('_contact')) : null;
      const company = resolveCompany(compName) || (pc && pc.company) || '';
      const pid = pc ? pc.id : resolveContact(cname, g('_cemail'), g('_cphone'), company);
      const rec = { id: uid(obj[0]), name, company, contacts: pid ? [pid] : [], value: parseVal(field(obj, 'value'), g('value')), owner: me(), created: today, nextStep: g('nextStep'), nextDate: g('nextDate') || addDays(obj === 'lead' ? 0 : 3) };
      if (obj === 'lead') Object.assign(rec, { status: 'Nowy', statusAt: today, source: g('source'), icp: '', disqReason: '', dealId: '' });
      else Object.assign(rec, { stage: g('stage') || 'Nowe', stageAt: today, close: addDays(30), closedAt: '', lostReason: '', leadId: '' });
      db[obj].unshift(rec);
      logAct(obj, rec.id, 'system', obj === 'lead' ? `Dodano leada${rec.source ? ' · źródło: ' + rec.source : ''}` : `Utworzono szansę w etapie: ${rec.stage}`);
      closeModal(); render(); refreshDrawer();
      toast(`Dodano: ${rec.name}`, { label: 'Otwórz', fn: () => openRecord(obj, rec.id) });
      return;
    }
    const rec = { id: uid(obj[0]), created: today };
    for (const f of S.fields) { const v = fd.get(f.key); if (v !== null && String(v).trim() !== '') rec[f.key] = parseVal(f, v); }
    if (!rec.name) return fail('#addErr', '#n-name', `Podaj: ${field(obj, 'name').label.toLowerCase()}.`);
    if (isDup(obj, rec) && !form.dataset.force) {
      form.dataset.force = '1';
      return fail('#addErr', null, `Taki rekord już istnieje (${rec.email ? 'ten sam e-mail lub ta sama nazwa' : 'ta sama nazwa'}). Kliknij „Utwórz” ponownie, aby dodać mimo to.`);
    }
    db[obj].unshift(rec);
    closeModal(); render(); refreshDrawer();
    toast(`Dodano: ${rec.name}`, { label: 'Otwórz', fn: () => openRecord(obj, rec.id) });
  }
  if (form.id === 'nextForm') {
    const obj = form.dataset.obj || 'deal', r = find(obj, form.dataset.id), text = g('text');
    if (!r) { closeModal(); return; }
    if (!text) return fail('#nsErr', '#ns-text', 'Opisz krok w kilku słowach.');
    const mode = stepCtx && stepCtx.id === r.id ? stepCtx.mode : 'edit';
    if (mode === 'complete') logAct(obj, r.id, 'task', r.nextStep || 'Następny krok');
    r.nextStep = text; r.nextDate = g('date') || addDays(3);
    stepCtx = null;
    closeModal(); render(); refreshDrawer();
    toast(mode === 'complete' ? `Zadanie zamknięte · kolejny krok ${rel(r.nextDate)}` : `Następny krok: ${rel(r.nextDate)}`);
  }
  if (form.id === 'lostForm') {
    const d = find('deal', form.dataset.id), reason = fd.get('reason'), note = g('note');
    if (!reason) return fail('#lostErr', null, 'Wybierz powód — to ważna wiedza na przyszłość.');
    d.lostReason = reason;
    if (note) logAct('deal', d.id, 'note', note);
    closeModal(); render(); refreshDrawer();
    toast(`Zapisano powód: ${reason}`);
  }
  if (form.id === 'convForm') {
    const l = find('lead', form.dataset.id); if (!l) { closeModal(); return; }
    if (!fd.get('icp') || !fd.get('interest')) return fail('#cvErr', null, 'Szansa sprzedaży to klient z ICP, który jest zainteresowany. Jeśli jeszcze tego nie wiesz — zostaw go jako leada w kwalifikacji.');
    if (!g('name')) return fail('#cvErr', '#cv-name', 'Podaj nazwę szansy.');
    if (!g('step')) return fail('#cvErr', '#cv-step', 'Szansa potrzebuje następnego kroku — co i kiedy zrobisz?');
    const d = { id: uid('d'), name: g('name'), company: l.company || '', contacts: [...(l.contacts || [])], value: parseVal(field('deal', 'value'), g('value')) || 0, stage: g('stage') || 'Kontakt', stageAt: today, close: addDays(30), owner: l.owner || me(), created: today, nextStep: g('step'), nextDate: g('date') || addDays(2), closedAt: '', lostReason: '', leadId: l.id };
    db.deal.unshift(d);
    const prev = l.status;
    Object.assign(l, { status: 'Skonwertowany', statusAt: today, icp: 'Pasuje', dealId: d.id, convertedAt: today, nextStep: '', nextDate: '' });
    logAct('lead', l.id, 'stage', `${prev} → Skonwertowany`);
    logAct('lead', l.id, 'system', `Skonwertowano na szansę: ${d.name}`);
    logAct('deal', d.id, 'system', `Utworzono z leada: ${l.name}`);
    closeModal(); openRecord('deal', d.id);
    toast(`Nowa szansa w lejku: ${d.name}`);
  }
  if (form.id === 'disqForm') {
    const l = find('lead', form.dataset.id), reason = fd.get('reason'), note = g('note');
    if (!l) { closeModal(); return; }
    if (!reason) return fail('#disqErr', null, 'Wybierz powód — po kilku tygodniach zobaczysz, które leady najczęściej odpadają.');
    const prev = { status: l.status, statusAt: l.statusAt, nextStep: l.nextStep, nextDate: l.nextDate };
    Object.assign(l, { status: 'Odrzucony', statusAt: today, disqReason: reason, nextStep: '', nextDate: '' });
    logAct('lead', l.id, 'stage', `${prev.status} → Odrzucony`); const actId = db.activity[0].id;
    if (note) logAct('lead', l.id, 'note', note);
    closeModal(); render();
    toast(`Odrzucono: ${recLabel('lead', l)}`, { label: 'Cofnij', fn: () => { Object.assign(l, prev, { disqReason: '' }); db.activity = db.activity.filter(a => a.id !== actId); render(); toast('Przywrócono leada'); } });
  }
  if (form.id === 'fieldForm') {
    const label = g('label'), type = fd.get('type');
    if (!label) { $('#nf-label').classList.add('err'); $('#nf-label').focus(); return; }
    const f = { key: 'cf' + Date.now().toString(36), label, type };
    if (type === 'select') {
      const opts = String(fd.get('options') || '').split(',').map(s => s.trim()).filter(Boolean);
      if (!opts.length) { $('#nf-opt').classList.add('err'); $('#nf-opt').focus(); toast('Podaj opcje listy, oddzielone przecinkami'); return; }
      f.options = opts.map((o, i) => [o, CYCLE[i % CYCLE.length]]);
    }
    SCHEMA[state.settingsObj].fields.push(f);
    renderSettings(); save(); toast(`Dodano pole: ${label}`);
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.edit) {
    const inDrawer = !!t.closest('.drawer'), tgt = inDrawer ? openRec : state.rec; if (!tgt) return;
    const r = find(tgt.obj, tgt.id), f = field(tgt.obj, t.dataset.edit); if (!r || !f) return;
    const v = parseVal(f, t.value);
    if (f.key === 'name' && !v) { t.value = r.name; return; }
    if (tgt.obj === 'deal' && f.key === 'stage') { if (v) setStage(r, v); else t.value = r.stage; return; }
    if (tgt.obj === 'lead' && f.key === 'status') { if (v) setLeadStatus(r, v); else t.value = r.status; return; }
    r[f.key] = v;
    if (inDrawer) { const sub = $('#hero-sub'); if (sub) sub.textContent = subtitle(tgt.obj, r) || ' '; renderSide(); if (state.page !== 'record') renderMain(); else renderRecord(); }
    else { refreshRecHead(); renderSide(); save(); const c = $('.crumb-cur'); if (c) c.textContent = r.name; }
    return;
  }
  if (t.dataset.map !== undefined && imp) { imp.map[+t.dataset.map] = t.value; renderImport(); return; }
  if (t.dataset.fl) {
    const f = field(state.settingsObj, t.dataset.fl);
    if (t.value.trim()) { f.label = t.value.trim(); save(); toast('Zapisano nazwę pola'); } else t.value = f.label;
    return;
  }
  if (t.dataset.setting === 'aiKey') {
    const v = t.value.trim();
    if (!v || v.includes('•')) return;
    aiCfg.key = v; saveAiCfg(); renderSettings(); toast('Połączono Hermes AI z Claude API');
    return;
  }
  if (t.dataset.setting === 'aiModel') { aiCfg.model = t.value.trim() || 'claude-sonnet-5-5'; saveAiCfg(); toast(`Model: ${aiCfg.model}`); return; }
  if (t.dataset.setting === 'userName' || t.dataset.setting === 'company') {
    settings[t.dataset.setting] = t.value.trim(); t.value = settings[t.dataset.setting];
    renderSide(); save(); toast(t.dataset.setting === 'userName' ? 'Zapisano imię' : 'Zapisano nazwę firmy');
    return;
  }
  if (t.dataset.setting === 'target') {
    const v = Number(String(t.value).replace(/[^\d]/g, ''));
    if (v > 0) { settings.target = v; settings.targetSet = true; t.value = grp(v); renderSide(); save(); toast(`Cel miesiąca: ${money(v)}`); } else t.value = grp(settings.target);
    return;
  }
  if (t.name === 'reason') { document.querySelectorAll('.chip-btn.radio').forEach(l => l.classList.toggle('on', l.querySelector('input').checked)); return; }
  if (t.id === 'csvfile' && t.files[0]) readFile(t.files[0]);
  if (t.id === 'backupfile' && t.files[0]) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const s = JSON.parse(String(rd.result));
        if (s.app !== 'hermes-crm' || !applyState(s)) throw new Error('bad');
        openRec = null; state.rec = null; if (state.page === 'record') state.page = 'overview';
        renderDrawer(); render(); toast('Wczytano kopię zapasową');
      } catch (err) { toast('To nie jest poprawna kopia Hermesa'); }
    };
    rd.readAsText(t.files[0], 'UTF-8');
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.role === 'q') { state.q = t.value; renderRows(); }
  else if (t.dataset.role === 'cmdq') renderCmd(t.value);
  else if (t.dataset.role === 'pick' && state.picker) { state.picker.q = t.value; const b = $('#pick-res'); if (b) b.innerHTML = pickRes(state.picker.kind); }
  else if (t.id === 'ai-input') { t.style.height = 'auto'; t.style.height = Math.min(140, t.scrollHeight) + 'px'; }
  else if (t.name === '_cname') {
    const c = db.contact.find(x => norm(x.name) === norm(t.value));
    if (c) { const fill = (id, v) => { const i = $(id); if (i && !i.value && v) i.value = v; }; fill('#n-_cemail', c.email); fill('#n-_cphone', c.phone); fill('#n-_company', nameOf('company', c.company)); }
  }
  if (t.classList.contains('err')) { t.classList.remove('err'); t.removeAttribute('aria-invalid'); }
});

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmd(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'j') { e.preventDefault(); const c = curRec(); ai.open ? closeAI() : openAI(c || ai.ctx); return; }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'ai-input') { e.preventDefault(); const f = $('#aiForm'); if (f) f.requestSubmit ? f.requestSubmit() : f.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true })); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && (e.target.id === 'act-text' || e.target.id === 'ract-text')) { e.preventDefault(); logEntry(e.target.id === 'ract-text' ? 'rec' : 'drawer'); return; }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.role === 'pick') { e.preventDefault(); const b = $('#pick-res .pick-row'); if (b) b.click(); return; }
  if (e.key === 'Escape') {
    if (isModal()) { if (!modalLock) closeModal(); }
    else if (ai.open) closeAI();
    else if (openRec) { openRec = null; renderDrawer(); }
    else if (state.picker) { state.picker = null; renderMain(); }
    else if (state.page === 'record' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) { const b = $('[data-act="rec-back"]') || $('.crumbs [data-act="go"]'); if (b) b.click(); }
    return;
  }
  if (e.key === 'Enter' && e.target.id === 'cmdq') { const b = $('#cmdres .cmdrow'); if (b) b.click(); return; }
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
  if (e.key === 'Enter' && e.target.classList.contains('deal-card')) { e.target.click(); return; }
  if (e.key === 'n' && !e.metaKey && !e.ctrlKey && !isModal()) { e.preventDefault(); openAdd(addTarget()[0]); }
});


/* chart tooltips */
const tip = $('#tip');
function showTip(el, x, y) {
  tip.textContent = el.dataset.tip; tip.classList.add('show');
  const w = tip.offsetWidth;
  tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x - w / 2)) + 'px';
  tip.style.top = Math.max(8, y - 46) + 'px';
}
document.addEventListener('mousemove', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) showTip(el, e.clientX, e.clientY); else tip.classList.remove('show');
});
document.addEventListener('focusin', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top); } else tip.classList.remove('show');
});

/* drag & drop: kanban + CSV */
document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('.deal-card'); if (!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging');
});
document.addEventListener('dragend', () => document.querySelectorAll('.dragging,.over').forEach(x => x.classList.remove('dragging', 'over')));
document.addEventListener('dragover', e => {
  const col = e.target.closest && e.target.closest('.kcol'), drop = e.target.closest && e.target.closest('.drop');
  if (!col && !drop) return;
  e.preventDefault();
  const el = col || drop;
  document.querySelectorAll('.over').forEach(x => x !== el && x.classList.remove('over'));
  el.classList.add('over');
});
document.addEventListener('drop', e => {
  const drop = e.target.closest && e.target.closest('.drop');
  if (drop) { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) readFile(f); return; }
  const col = e.target.closest && e.target.closest('.kcol'); if (!col) return;
  e.preventDefault();
  col.classList.remove('over');
  const d = find('deal', e.dataTransfer.getData('text/plain'));
  if (d) setStage(d, col.dataset.stage);
});

load();
render();

</script>
</body>
</html>
