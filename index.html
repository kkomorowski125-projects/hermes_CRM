<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#171916;--ink2:#2B2F29;--text:#454B43;--mute:#6B7168;--faint:#8A9086;
  --line:#D8DDD5;--line2:#E8EBE5;--soft:#F0F2ED;--paper:#F7F8F5;--bg:#E9ECE8;
  --lime:#D7FF3F;--late:#B9442F;--lateDot:#DD644E;--ok:#5E7F2C;
  --display:'Space Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:14px/1.45 'DM Sans',system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:geometricPrecision}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
::selection{background:var(--lime);color:var(--ink)}
*{scrollbar-width:thin;scrollbar-color:#C9C9C0 transparent}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mute{color:var(--mute)}
.eyebrow{margin:0;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}

/* ---------- sidebar ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;z-index:20;width:252px;display:flex;flex-direction:column;padding:26px 16px 18px;background:var(--ink);color:#fff;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 24px;border:0;background:transparent;color:#fff;font:700 22px/1 var(--display);letter-spacing:-.04em;text-align:left}
.brand svg{transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.brand:hover svg{transform:translateX(3px) skewX(-5deg)}
.workspace{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #343731;border-radius:10px;background:#20231F}
.workspace-avatar{width:34px;height:34px;display:grid;place-items:center;flex-shrink:0;border-radius:8px;background:var(--lime);color:var(--ink);font-size:12px;font-weight:700}
.workspace span,.profile span{display:flex;flex-direction:column;min-width:0}
.workspace b,.profile b{font-size:13px;font-weight:600}
.workspace small,.profile small{color:#8A8F85;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:26px}
.nav-label{padding:0 12px 8px;color:#6E7369;font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase}
.nav-label.second{margin-top:20px}
.nav a{position:relative;height:42px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:8px;color:#A0A59B;font-size:14px;transition:.16s ease}
.nav a:hover{color:#fff;background:#222520}
.nav a.on{color:#fff;background:#292C27;box-shadow:inset 0 0 0 1px #373B34;font-weight:600}
.nav a.on::before{content:'';position:absolute;left:0;width:3px;height:18px;border-radius:0 2px 2px 0;background:var(--lime)}
.nav em{margin-left:auto;min-width:24px;padding:2px 7px;border-radius:6px;background:#2B2E29;color:#A0A59B;font-size:12px;font-style:normal;text-align:center}
.nav a.on em{background:var(--lime);color:var(--ink)}
.side-bottom{margin-top:auto;padding:22px 8px 0}
.target{display:flex;justify-content:space-between;align-items:flex-end;font-size:12px}
.target>span{display:flex;flex-direction:column;gap:2px}
.target small{color:#80857B}
.target>b{font-size:13px}
.progress{height:4px;margin:10px 0 18px;border-radius:2px;background:#30332E;overflow:hidden}
.progress i{display:block;height:100%;background:var(--lime);border-radius:inherit;transition:width .4s}
.profile{display:flex;align-items:center;gap:10px;padding-top:14px;border-top:1px solid #30332E}
.profile-avatar{width:36px;height:36px;display:grid;place-items:center;flex-shrink:0;border-radius:9px;background:#B7C8FF;color:var(--ink);font-size:12px;font-weight:700}

/* ---------- main ---------- */
.main{min-width:0;min-height:calc(100vh - 12px);margin:6px 6px 6px 258px;border:1px solid #DFE3DD;border-radius:12px;background-color:var(--paper);background-image:linear-gradient(rgba(24,27,23,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(24,27,23,.03) 1px,transparent 1px);background-size:28px 28px;box-shadow:0 3px 14px rgba(23,24,20,.04)}
.topbar{height:70px;display:flex;align-items:center;gap:12px;padding:0 36px;border-bottom:1px solid var(--line2);background:rgba(247,248,245,.85);border-radius:12px 12px 0 0}
.search{width:440px;max-width:100%;height:42px;display:flex;align-items:center;gap:10px;padding:0 12px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--faint);font-size:14px;text-align:left;transition:.15s}
.search:hover{border-color:var(--line);background:#fff}
.search kbd{margin-left:auto;padding:3px 8px;border:1px solid #DEDED8;border-radius:5px;background:#F5F5F1;color:#8E9088;font:12px 'DM Sans';white-space:nowrap}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-button{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:#fff;color:#5A6057}
.icon-button:hover{border-color:#BFC6BB;color:var(--ink)}
.primary-button{height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border:1px solid #161814;border-radius:8px;background:#1B1E19;color:#fff;font-size:14px;font-weight:600;box-shadow:0 2px 3px rgba(0,0,0,.12);transition:.16s ease;white-space:nowrap}
.primary-button:hover{transform:translateY(-1px);background:#292D26;box-shadow:0 6px 16px rgba(18,20,16,.16)}
.primary-button:disabled{opacity:.4;transform:none;cursor:not-allowed}
.ghost-button{height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);font-size:14px;font-weight:500;white-space:nowrap}
.ghost-button:hover{border-color:#BFC6BB;color:var(--ink);background:#FBFCFA}
.ghost-button.sm,.primary-button.sm{height:36px;padding:0 12px;font-size:13px}
.text-button{display:inline-flex;align-items:center;gap:7px;padding:0;border:0;background:transparent;color:#5A6057;font-size:13px;font-weight:600;white-space:nowrap}
.text-button:hover{color:var(--ink)}
.danger{color:var(--late)!important}
.page{max-width:1480px;margin:0 auto;padding:40px 40px 56px}
.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.heading-meta{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.heading-meta>span{display:flex;align-items:center;gap:6px;padding-left:10px;border-left:1px solid #D8DCD5;color:var(--mute);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.heading-meta i{width:7px;height:7px;border-radius:50%;background:#89B840;box-shadow:0 0 0 3px rgba(137,184,64,.15)}
.page-heading h1{margin:0;font:600 38px/1.08 var(--display);letter-spacing:-.045em}
.page-heading h1 span{color:#8D8E85;font-weight:500}
.page-heading p{margin:10px 0 0;color:var(--mute);font-size:15px}
.heading-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:8px;background:#EDF0EB}
.seg button{height:34px;padding:0 14px;border:0;border-radius:6px;background:transparent;color:var(--mute);font-size:13px;font-weight:600;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,23,18,.1)}

/* ---------- surfaces ---------- */
.panel{min-width:0;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(20,23,18,.04);overflow:hidden}
.panel-head{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.panel-head .ttl{display:grid;grid-template-columns:auto 1fr;align-items:baseline;column-gap:10px}
.panel-head .idx{grid-row:1/3;color:#A0A69C;font:500 12px var(--display)}
.panel-head h2{margin:0;font:600 17px var(--display);letter-spacing:-.02em}
.panel-head p{grid-column:2;margin:3px 0 0;color:var(--mute);font-size:13px}
.metrics{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:12px;margin-bottom:14px}
.metric{position:relative;min-height:162px;padding:22px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;box-shadow:0 1px 2px rgba(20,23,18,.04);transition:transform .16s,border-color .16s,box-shadow .16s}
.metric:hover{transform:translateY(-2px);border-color:#BFC6BB;box-shadow:0 8px 22px rgba(20,23,18,.08)}
.metric.featured{background:#1B1E19;border-color:#1B1E19;color:#fff}
.metric-label{display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-size:13px;font-weight:500}
.featured .metric-label{color:#AAA9A0}
.trend{padding:3px 8px;border-radius:6px;background:rgba(215,255,63,.14);color:var(--lime);font-size:12px;font-weight:600}
.metric-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:7px;background:var(--soft);color:#5F655C}
.metric strong{display:block;margin-top:22px;font:600 32px/1 var(--display);letter-spacing:-.045em}
.metric p{margin:12px 0 0;color:var(--mute);font-size:13px;display:flex;align-items:center;gap:6px}
.metric p b{color:var(--ink2);font-weight:600}
.featured strong{position:relative;z-index:1;font-size:36px}
.featured p{position:relative;z-index:1;color:#9A9B92}
.featured p b{color:#fff}
.sparkline{position:absolute;inset:64px 0 0 44%;opacity:.85}
.sparkline svg{width:100%;height:76px;overflow:visible}
.sparkline path{fill:none;stroke:var(--lime);stroke-width:2;vector-effect:non-scaling-stroke}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.75fr);gap:14px}

/* tags */
.tag{width:max-content;display:inline-flex;align-items:center;gap:7px;padding:4px 9px;border-radius:6px;background:#EEF1EC;color:#4A5047;font-size:12px;font-weight:600;white-space:nowrap}
.avatar{display:inline-grid;place-items:center;flex-shrink:0;border:1px solid #DFE3DC;border-radius:8px;background:var(--soft);color:#4D544B;font-weight:700;line-height:1}
.avatar.person{border-radius:50%;border-color:transparent;background:#DBE5FF;color:#384663}
.avatar.lead{border-radius:50%;border-color:transparent;background:#EDE6FF;color:#4F3F86}
.chip{display:inline-flex;align-items:center;gap:9px;white-space:nowrap;min-width:0}

/* tables */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left}
th{height:42px;padding:0 14px;border-bottom:1px solid var(--line2);color:#737A70;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;background:#FBFCFA}
td{height:66px;padding:0 14px;border-bottom:1px solid #EDF0EB;color:var(--text);font-size:14px;white-space:nowrap}
th:first-child,td:first-child{padding-left:22px}
th:last-child,td:last-child{padding-right:22px}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer;transition:background .15s,box-shadow .15s}
tr.row:hover td{background:#F8FAF5}
tr.row:hover td:first-child{box-shadow:inset 3px 0 var(--lime)}
.identity{display:flex;align-items:center;gap:12px;min-width:0;padding:0;border:0;background:transparent;text-align:left}
.identity span.t{display:flex;flex-direction:column;gap:2px;min-width:0}
.identity b{color:var(--ink2);font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.identity small{color:var(--faint);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.val{color:var(--ink2);font-weight:600}
.late-date{display:inline-flex;align-items:center;gap:6px;color:var(--late);font-weight:600}
.today-date{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600}
.empty{padding:56px 24px;text-align:center;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{margin:0;color:var(--ink);font:600 20px var(--display);letter-spacing:-.03em}
.empty .acts{display:flex;gap:8px;margin-top:8px}

/* up next */
.tasks{padding:6px 16px}
.task{display:flex;align-items:center;gap:12px;min-height:70px;border-bottom:1px solid #F0F0EB}
.task:last-child{border-bottom:0}
.task-check{width:24px;height:24px;display:grid;place-items:center;flex-shrink:0;padding:0;border:1px solid #D5D7CF;border-radius:50%;background:#fff;color:transparent}
.task-check.hot{border-color:#EFAE9F;background:#FFF6F3}
.task-check:hover{border-color:var(--ink)}
.task.done .task-check{border-color:#1B1E19;background:#1B1E19;color:#fff}
.task-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:0;border:0;background:transparent;text-align:left}
.task-body b{font-size:14px;font-weight:600;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-body small{font-size:12px;color:var(--faint)}
.task.done .task-body{opacity:.5}
.task.done .task-body b{text-decoration:line-through}
.task>svg{color:#B2B3AC;flex-shrink:0}
.wide-btn{width:calc(100% - 32px);height:44px;display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 16px 16px;border:1px solid transparent;border-radius:8px;background:var(--soft);color:#5A6057;font-size:13px;font-weight:600}
.wide-btn:hover{border-color:#DCE1D9;background:#ECEFE9;color:var(--ink)}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid #E1E5DC;border-radius:10px;background:#F5F7F2}
.note>span{width:26px;height:26px;display:grid;place-items:center;flex-shrink:0;border-radius:7px;background:#1B1E19;color:var(--lime);font-weight:700;font-size:13px}
.note div{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.note b{color:var(--ink2);font-size:14px}
.note p{margin:0;color:var(--mute);font-size:13px}

/* kanban */
.kanban-note{margin-bottom:14px}
.kanban{display:grid;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:start}
.kcol{min-height:520px;display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid #DFE3DC;border-radius:10px;background:rgba(240,243,238,.88);transition:background .15s,box-shadow .15s}
.kcol.over{background:#F6FFD9;box-shadow:inset 0 0 0 2px var(--lime)}
.khead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 8px;font-size:14px;font-weight:600}
.khead span{display:flex;align-items:center;gap:8px}
.khead em{min-width:26px;padding:3px 7px;border-radius:5px;background:#E1E5DE;color:#5F665C;font-size:12px;font-style:normal;text-align:center}
.ksum{padding:0 4px 4px;color:var(--faint);font-size:12px;font-weight:500;margin-top:-6px}
.deal-card{padding:16px;border:1px solid #DCE1D9;border-radius:9px;background:#fff;box-shadow:0 2px 3px rgba(20,20,15,.025);cursor:grab;transition:transform .15s,box-shadow .15s,border-color .15s}
.deal-card:hover{transform:translateY(-2px);border-color:#BFC6BB;box-shadow:0 8px 18px rgba(20,23,18,.08)}
.deal-card.dragging{opacity:.45;transform:rotate(1.5deg)}
.deal-card.won{border-color:#1B1E19;background:#1B1E19;color:#fff}
.deal-card.lost{opacity:.6}
.deal-card .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.deal-card h3{margin:14px 0 3px;font:600 15px var(--display);letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deal-card p{margin:0;color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deal-card footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line2);font-size:13px}
.deal-card footer b{font:600 16px var(--display);letter-spacing:-.02em}
.deal-card footer span{color:var(--faint)}
.deal-card.won p,.deal-card.won footer span{color:#9EA398}
.deal-card.won footer{border-top-color:#30332E}
.deal-card.won .avatar{background:#2B2E29;border-color:#3A3D37;color:#fff}
.won-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;background:var(--lime);color:var(--ink);font-size:12px;font-weight:700}
.add-card{width:100%;height:42px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px dashed #C7CCC3;border-radius:8px;background:transparent;color:#646A61;font-size:13px;font-weight:500}
.add-card:hover{border-style:solid;border-color:#AEB5AA;background:#fff;color:var(--ink)}

/* directory */
.dir-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.dir-stats article{min-height:118px;display:flex;flex-direction:column;padding:18px 20px;border:1px solid var(--line);border-radius:10px;background:#fff}
.dir-stats article>span{color:var(--mute);font-size:13px;font-weight:500}
.dir-stats strong{margin:14px 0 6px;font:600 28px/1 var(--display);letter-spacing:-.04em}
.dir-stats small{color:var(--faint);font-size:12px}
.dir-stats article.attention{border-color:#EADED8;background:#FFFDFB}
.dir-stats article.attention strong{color:var(--late)}
.toolbar{min-height:74px;display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.toolbar .ttl{margin-right:auto}
.toolbar h2{margin:0;font:600 17px var(--display);letter-spacing:-.02em}
.toolbar .ttl span{display:block;margin-top:2px;color:var(--faint);font-size:12px}
.field-search{width:260px;max-width:100%;height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#FAFBF8;color:var(--faint)}
.field-search:focus-within{border-color:#919286;background:#fff;box-shadow:0 0 0 3px #F0F1E9}
.field-search input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink);font-size:14px}

/* analytics */
.kpis{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{min-width:0;min-height:164px;padding:20px 22px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;flex-direction:column}
.kpi.dark{background:#1B1E19;border-color:#1B1E19;color:#fff}
.kpi .h{display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-size:13px}
.kpi.dark .h{color:#9CA197}
.kpi .h em{padding:3px 8px;border-radius:5px;background:#EFF5E5;color:var(--ok);font-size:12px;font-style:normal;font-weight:600}
.kpi.dark .h em{background:rgba(215,255,63,.13);color:var(--lime)}
.kpi strong{display:block;margin:22px 0 16px;font:600 32px/1 var(--display);letter-spacing:-.045em}
.kpi footer{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--faint);font-size:12px}
.kpi footer span{display:flex;align-items:center;gap:6px}
.kpi footer b{color:var(--text);font-weight:600}
.kpi.dark footer b{color:#C8CDC3}
.kpi-progress{height:4px;margin-top:10px;border-radius:2px;background:#343831;overflow:hidden}
.kpi-progress i{display:block;height:100%;background:var(--lime)}
.rgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,.75fr);gap:14px;margin-bottom:14px}
.rgrid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:14px;margin-bottom:14px}
.cols-chart{display:flex;gap:12px;padding:22px 24px 20px}
.cols-y{width:44px;display:flex;flex-direction:column;justify-content:space-between;padding-bottom:28px;color:var(--faint);font-size:11px;text-align:right}
.cols-area{flex:1;min-width:0;display:flex;flex-direction:column}
.cols{position:relative;height:220px;display:flex;align-items:flex-end;gap:22px;padding:0 6px;border-bottom:1px solid var(--line2);background-image:linear-gradient(var(--line2) 1px,transparent 1px);background-size:100% 55px;background-position:0 0}
.colb{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.colb .v{font:600 14px var(--display);letter-spacing:-.02em;color:var(--ink2)}
.colb .c{width:100%;max-width:58px;border-radius:5px 5px 0 0;background:#1B1E19;min-height:3px}

function initials(name, person) {
  const s = String(name || '?').trim();

  if (person || w.length > 1) return w.map(x => x[0]).join('').slice(0, 2).toUpperCase();

}
const avatar = (name, obj, size = 36) => {
  const cls = SCHEMA[obj] ? SCHEMA[obj].av : obj;

};
function tag(f, v) {
  if (!v) return '<span class="mute">—</span>';
  const o = (f.options || []).find(o => o[0] === v);
  return `<span class="tag"><i class="dot" style="background:${TONE[o ? o[1] : 'gray']}"></i>${esc(v)}</span>`;
}
const dateCell = (v, closed) => {
  if (!v) return '<span class="mute">—</span>';
  if (!closed && v < today) return `<span class="late-date"><i class="dot" style="background:var(--lateDot)"></i>${esc(fdate(v))}</span>`;
  if (!closed && v === today) return `<span class="today-date"><i class="dot" style="background:#89B840"></i>Dziś</span>`;
  return `<span class="mute">${esc(fdate(v))}</span>`;
};
function cell(f, r) {
  const v = r[f.key];
  if (f.type === 'date') return dateCell(v, CLOSED.includes(r.stage));
  if (v === undefined || v === null || v === '') return '<span class="mute">—</span>';
  switch (f.type) {
    case 'money': return `<span class="val">${money(v)}</span>`;
    case 'select': return tag(f, v);
    case 'relation': { const n = nameOf(f.to, v); return n ? `<span class="chip">${avatar(n, f.to, 26)}${esc(n)}</span>` : '<span class="mute">—</span>'; }
    case 'email': return `<span class="mute">${esc(v)}</span>`;
    default: return esc(v);
  }
}
function control(f, v, mode) {
  const id = (mode === 'edit' ? 'e-' : 'n-') + f.key;
  const a = mode === 'edit' ? `class="in" id="${id}" data-edit="${f.key}"` : `class="fin" id="${id}" name="${f.key}"`;
  v = v ?? '';
  if (f.type === 'select') return `<select ${a}><option value="">—</option>${f.options.map(o => `<option${o[0] === v ? ' selected' : ''}>${esc(o[0])}</option>`).join('')}</select>`;
  if (f.type === 'relation') return `<select ${a}><option value="">—</option>${db[f.to].map(r => `<option value="${r.id}"${r.id === v ? ' selected' : ''}>${esc(r.name)}</option>`).join('')}</select>`;
  const type = { email: 'email', phone: 'tel', date: 'date' }[f.type] || 'text';
  const im = (f.type === 'money' || f.type === 'number') ? ' inputmode="decimal"' : '';
  const ph = mode === 'form' ? ({ money: '0 zł', email: 'nazwa@firma.pl', phone: '600 000 000', number: '0', text: f.key === 'name' ? 'np. ' + ({ company: 'Meble Dębowe', contact: 'Jan Kowalski', lead: 'Anna Nowak', deal: 'Wdrożenie sklepu' }[f._obj] || '') : '' }[f.type] || '') : '';
  return `<input type="${type}" ${a}${im} value="${esc(v)}"${ph ? ` placeholder="${esc(ph)}"` : ''} autocomplete="off">`;
}
function parseVal(f, raw) {
  if (f.type === 'money' || f.type === 'number') {
    if (String(raw).trim() === '') return '';
    return Number(String(raw).replace(/[\s zł]/g, '').replace(',', '.')) || 0;

  return typeof raw === 'string' ? raw.trim() : raw;
}

function sparkPath(vals) {
  const max = Math.max(1, ...vals), min = Math.min(...vals), n = vals.length - 1;
  const pts = vals.map((v, i) => [i / n * 400, 62 - (v - min) / Math.max(1, max - min) * 52]);
  return pts.map((p, i) => {
    if (!i) return `M${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
    const q = pts[i - 1], cx = (q[0] + p[0]) / 2;
    return `C${cx.toFixed(1)} ${q[1].toFixed(1)} ${cx.toFixed(1)} ${p[1].toFixed(1)} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
  }).join(' ');
}
function trend6(deals) {
  const out = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
    const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    out.push({ k, v: sum(deals.filter(x => (x.created || '').slice(0, 7) <= k && x.stage !== 'Przegrana')) });
  }
  return out;
}

function card(d) {
  const cn = nameOf('company', d.company), pn = nameOf('contact', d.contact);

  const late = d.close && d.close < today && !won && !lost;
  return `<article class="deal-card${won ? ' won' : ''}${lost ? ' lost' : ''}" draggable="true" tabindex="0" data-act="open" data-obj="deal" data-id="${d.id}" aria-label="${esc((cn || d.name) + ', ' + money(d.value))}">
    <div class="top">${avatar(cn || d.name, 'company', 30)}${won ? '<span class="won-badge">Wygrana</span>' : late ? '<span class="late-date" style="font-size:12px"><i class="dot" style="background:var(--lateDot)"></i>Po terminie</span>' : ''}</div>
    <h3>${esc(cn || d.name)}</h3><p>${esc(cn ? d.name : (pn || ''))}${cn && pn ? ' · ' + esc(pn) : ''}</p>
    <footer><b>${money(d.value)}</b><span>${esc(fdate(d.close))}</span></footer>
  </article>`;
}

/* ================= directory (objects) ================= */
function dirStats(o) {
  const L = db[o];
  const deals = db.deal, open = deals.filter(d => !CLOSED.includes(d.stage));
  if (o === 'company') {
    const withOpen = L.filter(c => open.some(d => d.company === c.id));
    return [['Wszystkie firmy', L.length, `${L.filter(c => (c.created || '') >= today.slice(0, 7)).length} dodane w tym miesiącu`], ['Z otwartą szansą', withOpen.length, `${pct(withOpen.length, L.length) ?? 0}% kont`], ['Wartość lejka', kzl(sum(open)), `${open.length} otwartych szans`], ['Bez aktywnej szansy', L.length - withOpen.length, 'Warto się odezwać']];
  }
  if (o === 'contact') {
    const noCo = L.filter(c => !c.company).length;
    return [['Wszystkie kontakty', L.length, 'Osoby w bazie'], ['Z e-mailem', L.filter(c => c.email).length, 'Gotowe do wysyłki'], ['Przypisane do firmy', L.length - noCo, `${pct(L.length - noCo, L.length) ?? 0}% kontaktów`], ['Bez firmy', noCo, noCo ? 'Uzupełnij powiązanie' : 'Wszystko powiązane']];
  }
  if (o === 'lead') {
    const by = s => L.filter(l => l.status === s).length;
    return [['Wszystkie leady', L.length, 'W skrzynce'], ['Nowe', by('Nowy'), 'Do pierwszego kontaktu'], ['Zakwalifikowane', by('Zakwalifikowany'), `${pct(by('Zakwalifikowany'), L.length) ?? 0}% konwersji`], ['Odrzucone', by('Odrzucony'), 'Poza grupą docelową']];
  }
  const late = open.filter(d => d.close && d.close < today);
  return [['Wszystkie szanse', L.length, `${open.length} otwartych`], ['Wartość otwartych', kzl(sum(open)), 'Bez wygranych i przegranych'], ['Wygrane', kzl(sum(L.filter(d => d.stage === 'Wygrana'))), `${L.filter(d => d.stage === 'Wygrana').length} zamknięte z sukcesem`], ['Po terminie', late.length, late.length ? money(sum(late)) + ' do odzyskania' : 'Wszystko na czas']];
}

/* ================= analytics ================= */
function renderAnalytics() {
  const owners = field('deal', 'owner').options.map(o => o[0]);
  const ow = state.aOwner;
  const deals = db.deal.filter(d => !ow || d.owner === ow);
  const open = deals.filter(d => !CLOSED.includes(d.stage));
  const won = deals.filter(d => d.stage === 'Wygrana'), lost = deals.filter(d => d.stage === 'Przegrana');
  const leads = db.lead, qual = leads.filter(l => l.status === 'Zakwalifikowany');
  const target = ow ? TARGET / owners.length : TARGET;
  const wonV = sum(won), att = pct(wonV, target);
  const wr = pct(won.length, won.length + lost.length), lc = pct(qual.length, leads.length);
  const avg = open.length ? sum(open) / open.length : 0;

  const months = {};
  open.filter(d => d.close).forEach(d => { const k = d.close.slice(0, 7); (months[k] = months[k] || []).push(d); });
  const mkeys = Object.keys(months).sort();
  const mmax = Math.max(1, ...mkeys.map(k => sum(months[k])));
  const peak = mkeys.reduce((a, k) => sum(months[k]) > sum(months[a] || []) ? k : a, mkeys[0]);
  const mlabel = k => { const s = new Date(k + '-01T00:00:00').toLocaleDateString('pl-PL', { month: 'short', year: '2-digit' }); return s.charAt(0).toUpperCase() + s.slice(1); };
  const ystep = Math.ceil(mmax / 4 / 10000) * 10000 || 10000;

  const thisMonth = today.slice(0, 7);
  const closingNow = open.filter(d => (d.close || '').slice(0, 7) <= thisMonth);
  const commit = wonV, best = sum(closingNow), gap = Math.max(0, target - commit - best);
  const cov = pct(commit + best, target);
  const C = 2 * Math.PI * 48;
  const segC = Math.min(1, commit / target) * C, segB = Math.min(1 - segC / C, best / target) * C;
  const late = open.filter(d => d.close && d.close < today);

  const stageRows = field('deal', 'stage').options.filter(o => !CLOSED.includes(o[0]));
  const smax = Math.max(1, ...stageRows.map(o => sum(deals.filter(d => d.stage === o[0]))));
  const srcRows = field('lead', 'source').options.map(o => {
    const L = leads.filter(l => l.source === o[0]), q = L.filter(l => l.status === 'Zakwalifikowany').length;
    return { label: o[0], n: L.length, q, rate: pct(q, L.length) };
  }).filter(r => r.n).sort((a, b) => b.n - a.n);
  const nmax = Math.max(1, ...srcRows.map(r => r.n));

  main.innerHTML = heading({ eyebrow: `Raport · ${new Date().toLocaleDateString('pl-PL', { month: 'long', year: 'numeric' })}`, title: 'Analityka', accent: '.', sub: 'Przychód, prognoza i wyniki zespołu w jednym widoku.',
    actions: `<div class="seg" role="group" aria-label="Opiekun">${['', ...owners].map(o => `<button data-act="aowner" data-v="${esc(o)}" aria-pressed="${o === ow}">${o ? esc(o) : 'Cały zespół'}</button>`).join('')}</div>` }) + `
    <section class="kpis" aria-label="Wyniki sprzedaży">
      <article class="kpi dark"><div class="h"><span>Wygrane w miesiącu</span><em>${att}% celu</em></div><strong>${money(wonV)}</strong>
        <footer><span><i class="dot" style="background:var(--lime)"></i>${wonV >= target ? 'Cel osiągnięty' : money(target - wonV) + ' do celu'}</span><b>cel ${kzl(target)}</b></footer><div class="kpi-progress"><i style="width:${Math.min(100, att)}%"></i></div></article>
      <article class="kpi"><div class="h"><span>Wartość otwartych</span><em>${open.length} szans</em></div><strong>${money(sum(open))}</strong><footer><span>Średnio ${money(avg)}</span><b>${late.length ? late.length + ' po terminie' : 'Na czas'}</b></footer></article>
      <article class="kpi"><div class="h"><span>Skuteczność</span><em>${won.length}/${won.length + lost.length}</em></div><strong>${wr === null ? '—' : wr + '%'}</strong><footer><span>Wygrane z zamkniętych</span><b>${wr === null ? '—' : wr >= 50 ? 'Dobrze' : 'Do poprawy'}</b></footer></article>
      <article class="kpi"><div class="h"><span>Konwersja leadów</span><em>${qual.length}/${leads.length}</em></div><strong>${lc === null ? '—' : lc + '%'}</strong><footer><span>Zakwalifikowane leady</span><b>${leads.filter(l => l.status === 'Nowy').length} nowych</b></footer></article>
    </section>
    <div class="rgrid">
      <section class="panel">
        <div class="panel-head"><div class="ttl"><span class="idx">01</span><h2>Prognoza zamknięć</h2><p>Wartość otwartych szans wg miesiąca zamknięcia</p></div></div>
        ${mkeys.length ? `<div class="cols-chart"><div class="cols-y">${[4, 3, 2, 1, 0].map(i => `<span>${kzl(ystep * i).replace(' tys.', 'k')}</span>`).join('')}</div>
          <div class="cols-area"><div class="cols">${mkeys.map(k => { const s = sum(months[k]), n = months[k].length, t = `${mlabel(k)} · ${n} ${plural(n, 'szansa', 'szanse', 'szans')} · ${money(s)}`;
            return `<div class="colb" tabindex="0" data-tip="${esc(t)}" aria-label="${esc(t)}"><span class="v">${kzl(s)}</span><span class="c${k === peak ? ' peak' : ''}" style="height:${s / (ystep * 4) * 100}%"></span></div>`; }).join('')}</div>
          <div class="colx">${mkeys.map(k => `<span>${mlabel(k)}</span>`).join('')}</div></div></div>` : '<div class="empty"><p>Brak otwartych szans z datą zamknięcia.</p></div>'}
      </section>
      <section class="panel">
        <div class="panel-head"><div class="ttl"><span class="idx">02</span><h2>Pokrycie celu</h2><p>Wygrane + szanse na ten miesiąc</p></div></div>
        <div class="ring-wrap"><svg viewBox="0 0 120 120" role="img" aria-label="Pokrycie celu ${cov}%"><circle cx="60" cy="60" r="48" stroke="#EDF0EB"/><circle cx="60" cy="60" r="48" stroke="#B8C0FF" stroke-dasharray="${segB.toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-segC).toFixed(1)}"/><circle cx="60" cy="60" r="48" stroke="#1B1E19" stroke-dasharray="${segC.toFixed(1)} ${C.toFixed(1)}"/></svg><div><strong>${cov}%</strong><span>pokrycia</span></div></div>
        <div class="flist">
          <div><span><i style="background:#1B1E19"></i>Wygrane</span><b>${kzl(commit)}</b><em>${pct(commit, target)}%</em></div>
          <div><span><i style="background:#B8C0FF"></i>Do zamknięcia w tym mies.</span><b>${kzl(best)}</b><em>${pct(best, target)}%</em></div>
          <div><span><i style="background:#E3E6E0"></i>Brakuje do celu</span><b>${kzl(gap)}</b><em>${pct(gap, target)}%</em></div>
        </div>
        ${late.length ? `<div class="note rnote"><span>!</span><div><b>${late.length} ${plural(late.length, 'szansa wymaga', 'szanse wymagają', 'szans wymaga')} uwagi</b><p>${esc(late.slice(0, 2).map(d => nameOf('company', d.company) || d.name).join(' i '))} — termin minął.</p></div></div>` : '<div style="height:22px"></div>'}
      </section>
    </div>
    <div class="rgrid2">
      <section class="panel">
        <div class="panel-head"><div class="ttl"><span class="idx">03</span><h2>Zdrowie lejka</h2><p>Wartość i liczba szans na każdym etapie</p></div><button class="text-button" data-act="go" data-page="pipeline">Zobacz lejek ${ic('arrow', 15)}</button></div>
        <div style="padding:6px 0">${stageRows.map(o => { const ds = deals.filter(d => d.stage === o[0]), s = sum(ds), t = `${o[0]} · ${ds.length} ${plural(ds.length, 'szansa', 'szanse', 'szans')} · ${money(s)}`;
          return `<div class="frow" tabindex="0" data-tip="${esc(t)}" aria-label="${esc(t)}"><div><span>${esc(o[0])}</span><small>${ds.length} ${plural(ds.length, 'szansa', 'szanse', 'szans')}</small></div><div class="track"><i style="width:${s / smax * 100}%"></i></div><b>${kzl(s)}</b></div>`; }).join('')}</div>
        <div class="fsum"><div><span>Pokrycie celu</span><b>${(sum(open) / Math.max(1, target - wonV)).toFixed(1).replace('.', ',')}×</b></div><div><span>Po terminie</span><b class="${late.length ? 'warn' : ''}">${late.length}</b></div><div><span>Średnia szansa</span><b>${kzl(avg)}</b></div></div>
      </section>
      <section class="panel">
        <div class="panel-head"><div class="ttl"><span class="idx">04</span><h2>Zespół</h2><p>Realizacja celu i skuteczność</p></div></div>
        <div class="tablewrap"><table><thead><tr><th scope="col">Handlowiec</th><th scope="col">Wygrane</th><th scope="col">Otwarte</th><th scope="col">Cel</th></tr></thead>
        <tbody>${owners.map(o => { const ds = db.deal.filter(d => d.owner === o), w = sum(ds.filter(d => d.stage === 'Wygrana')), op = sum(ds.filter(d => !CLOSED.includes(d.stage))), a = pct(w, TARGET / owners.length);
          return `<tr><td><span class="chip">${avatar(o, 'contact', 32)}<b style="font-weight:600;color:var(--ink2)">${esc(o)}</b></span></td><td>${kzl(w)}</td><td>${kzl(op)}</td><td><div class="attain"><span><i style="width:${Math.min(100, a)}%"></i></span><b>${a}%</b></div></td></tr>`; }).join('')}</tbody></table></div>
      </section>
    </div>
    <section class="panel">
      <div class="panel-head"><div class="ttl"><span class="idx">05</span><h2>Jakość źródeł leadów</h2><p>Liczba leadów i odsetek zakwalifikowanych</p></div></div>
      ${srcRows.length ? `<div class="src">${srcRows.map(r => `<div tabindex="0" data-tip="${esc(`${r.label} · ${r.n} ${plural(r.n, 'lead', 'leady', 'leadów')} · ${r.q} zakwalifikowanych`)}"><span>${esc(r.label)}</span><b>${r.n}</b><div class="track"><i style="width:${r.n / nmax * 100}%"></i></div><small>${r.rate}% kwalifikacji</small></div>`).join('')}</div>` : '<div class="empty"><p>Brak leadów.</p></div>'}
    </section>`;
}

function renderDrawer() {
  const L = $('#drawerLayer');
  if (!openRec) { L.innerHTML = ''; return; }
  const { obj, id } = openRec, S = SCHEMA[obj], r = find(obj, id);
  if (!r) { openRec = null; L.innerHTML = ''; return; }
  const acts = [];
  if (r.email) acts.push(`<a href="mailto:${esc(r.email)}">${ic('mail', 16)}E-mail</a>`);
  if (r.phone) acts.push(`<a href="tel:${esc(String(r.phone).replace(/\s/g, ''))}">${ic('phone', 16)}Zadzwoń</a>`);
  if (obj === 'lead') acts.push(`<button class="lime" data-act="convert">${ic('arrow', 16)}Konwertuj</button>`);
  if (obj === 'company') acts.push(`<button data-act="add" data-obj="deal" data-pk="company" data-pid="${r.id}">${ic('plus', 16)}Szansa</button>`);
  let metrics = '';
  if (obj === 'company') {
    const ds = db.deal.filter(d => d.company === r.id), op = ds.filter(d => !CLOSED.includes(d.stage));
    metrics = `<div><span>Otwarty lejek</span><strong>${kzl(sum(op))}</strong></div><div><span>Otwarte szanse</span><strong>${op.length}</strong></div><div><span>Kontakty</span><strong>${db.contact.filter(c => c.company === r.id).length}</strong></div>`;
  } else if (obj === 'deal') {
    metrics = `<div><span>Wartość</span><strong>${money(r.value)}</strong></div><div><span>Etap</span><strong>${esc(r.stage || '—')}</strong></div><div><span>Zamknięcie</span><strong${r.close && r.close < today && !CLOSED.includes(r.stage) ? ' style="color:var(--late)"' : ''}>${esc(fdate(r.close) || '—')}</strong></div>`;
  } else if (obj === 'contact') {
    const ds = db.deal.filter(d => d.contact === r.id);
    metrics = `<div><span>Szanse</span><strong>${ds.length}</strong></div><div><span>Wartość</span><strong>${kzl(sum(ds))}</strong></div>`;
  } else {
    metrics = `<div><span>Status</span><strong>${esc(r.status || '—')}</strong></div><div><span>Źródło</span><strong>${esc(r.source || '—')}</strong></div>`;
  }
  const rel = [];
  if (obj === 'company') {
    rel.push(['Kontakty', 'contact', db.contact.filter(x => x.company === r.id), 'company']);
    rel.push(['Szanse', 'deal', db.deal.filter(x => x.company === r.id), 'company']);
  }
  if (obj === 'contact') rel.push(['Szanse', 'deal', db.deal.filter(x => x.contact === r.id), 'contact']);
  const heroCls = { company: '', contact: 'person', lead: 'lead', deal: 'deal' }[obj];
  L.innerHTML = `<div class="layer" data-act="close-drawer"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(S.one)}: ${esc(r.name)}">
    <header><span>Rekord · ${S.one}</span><div><button class="sq-btn" data-act="close-drawer" aria-label="Zamknij">${ic('close', 17)}</button></div></header>
    <section class="hero"><span class="hero-av ${heroCls}">${esc(initials(r.name, obj === 'contact' || obj === 'lead'))}</span><div><label class="sr" for="e-name">${esc(field(obj, 'name').label)}</label><input class="title-in" id="e-name" data-edit="name" value="${esc(r.name)}" autocomplete="off"><p id="hero-sub">${esc(subtitle(obj, r)) || '&nbsp;'}</p></div></section>
    ${acts.length ? `<div class="actions">${acts.join('')}</div>` : ''}
    <section class="dmetrics">${metrics}</section>
    <section class="dsec"><h3>Atrybuty</h3>${S.fields.filter(f => f.key !== 'name').map(f => `<div class="attr"><label for="e-${f.key}">${esc(f.label)}</label>${control(f, r[f.key], 'edit')}</div>`).join('')}</section>
    ${rel.map(([t, o, list, pk]) => `<section class="dsec"><h3>${t}<em>${list.length}</em></h3>
      ${list.map(x => `<button class="linked" data-act="open" data-obj="${o}" data-id="${x.id}">${avatar(x.name, o, 32)}<div><b>${esc(x.name)}</b><small>${o === 'deal' ? esc(x.stage + ' · ' + money(x.value)) : esc(x.role || x.email || '')}</small></div>${ic('chevron', 15)}</button>`).join('') || '<p class="hint">Brak powiązanych rekordów.</p>'}
      <button class="add-card" data-act="add" data-obj="${o}" data-pk="${pk}" data-pid="${r.id}">${ic('plus', 15)}Dodaj</button></section>`).join('')}
    <footer><span>Utworzono ${esc(fdate(r.created))}</span><button class="text-button danger" data-act="del">${ic('trash', 15)}Usuń</button></footer>
  </aside>`;
}

/* ================= modals ================= */
function modal(html, cls = '') {
  $('#modalLayer').innerHTML = `<div class="mlayer" data-act="close-modal-bg"><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
}
function closeModal() { $('#modalLayer').innerHTML = ''; imp = null; }
const isModal = () => !!$('#modalLayer').innerHTML;
const mhead = (eyebrow, title) => `<div class="mhead"><div><p class="eyebrow">${eyebrow}</p><h2>${title}</h2></div><button type="button" class="sq-btn" data-act="close-modal" aria-label="Zamknij">${ic('close', 17)}</button></div>`;

function openAdd(obj, preset = {}) {
  const S = SCHEMA[obj];
  const fs = S.fields.filter(f => f.quick || f.req).map(f => ({ ...f, _obj: obj }));
  const hidden = Object.keys(preset).filter(k => !fs.some(f => f.key === k));
  const [first, ...rest] = fs;
  const pairs = []; for (let i = 0; i < rest.length; i += 2) pairs.push(rest.slice(i, i + 2));
  const fl = f => `<div class="f"><label for="n-${f.key}">${esc(f.label)}${f.req ? ' <span class="req" aria-hidden="true">*</span>' : ''}</label>${control(f, preset[f.key], 'form')}</div>`;
  modal(`<form id="addForm" data-obj="${obj}" novalidate>
    ${mhead(`Nowy rekord · ${S.one}`, `Dodaj ${S.gen}`)}
    <div class="mbody">${fl(first)}${pairs.map(p => p.length === 2 ? `<div class="form-row">${p.map(fl).join('')}</div>` : fl(p[0])).join('')}
      ${hidden.map(k => `<input type="hidden" name="${k}" value="${esc(preset[k])}">`).join('')}
      <p class="hint" id="addErr" role="alert">Pozostałe pola uzupełnisz w karcie rekordu.</p></div>
    <div class="mfoot"><button type="button" class="ghost-button" data-act="close-modal">Anuluj</button><button type="submit" class="primary-button">Utwórz ${ic('arrow', 16)}</button></div>
  </form>`);
  setTimeout(() => $('#n-name') && $('#n-name').focus(), 0);
}

function openCmd() {
  modal(`<div class="cmdin">${ic('search', 20)}<label class="sr" for="cmdq">Szukaj</label><input id="cmdq" data-role="cmdq" placeholder="Szukaj firm, kontaktów, leadów, szans…" autocomplete="off"><kbd>Esc</kbd></div><div id="cmdres"></div>`, 'cmd');
  renderCmd('');
  setTimeout(() => $('#cmdq').focus(), 0);
}
function renderCmd(q) {
  const n = norm(q), out = [];
  for (const o of OBJS) for (const r of db[o]) if (!n || norm(r.name).includes(n) || norm(r.email).includes(n) || norm(subtitle(o, r)).includes(n)) out.push([o, r]);
  const res = out.slice(0, n ? 8 : 5);
  $('#cmdres').innerHTML = (res.length ? `<div class="cmdsep">${n ? 'Wyniki' : 'Szybki dostęp'}</div>` + res.map(([o, r]) => `<button class="cmdrow" data-act="open" data-obj="${o}" data-id="${r.id}">${avatar(r.name, o, 30)}<span><b style="font-weight:600">${esc(r.name)}</b></span><span class="k">${SCHEMA[o].one}</span></button>`).join('') : '<p class="hint" style="padding:12px">Nic nie znaleziono.</p>')
    + `<div class="cmdsep">Utwórz</div>` + OBJS.map(o => `<button class="cmdrow" data-act="add" data-obj="${o}">${ic('plus', 17)}Dodaj ${SCHEMA[o].gen}</button>`).join('');
}

/* ================= CSV import ================= */
function openImport(obj) { imp = { obj, step: 1 }; renderImport(); }
function renderImport() {
  const S = SCHEMA[imp.obj];
  if (imp.step === 1) {
    modal(`${mhead(`Import CSV · ${S.many}`, 'Wgraj plik')}
    <div class="mbody">
      <label class="drop" for="csvfile">${ic('upload', 24)}<b>Wybierz plik .csv</b><span class="mute">albo przeciągnij go tutaj</span><input type="file" id="csvfile" accept=".csv,text/csv,text/plain" class="sr"></label>
      <div class="f"><label for="csvpaste">…lub wklej dane</label><textarea id="csvpaste" rows="4" class="fin" placeholder="${esc(S.fields.slice(0, 4).map(f => f.label).join(';'))}"></textarea></div>
      <p class="hint">Pierwszy wiersz to nagłówki. Rozpoznamy: ${S.fields.map(f => esc(f.label)).join(', ')}. Separator: przecinek lub średnik.</p>
    </div>
    <div class="mfoot"><button type="button" class="text-button" data-act="tmpl">${ic('download', 16)}Pobierz szablon</button><button class="ghost-button" data-act="close-modal">Anuluj</button><button class="primary-button" data-act="imp-paste">Dalej ${ic('arrow', 16)}</button></div>`, 'wide');
  } else {
    const ok = imp.map.includes('name');
    modal(`${mhead(`${imp.rows.length} ${plural(imp.rows.length, 'wiersz', 'wiersze', 'wierszy')} · ${esc(imp.file || 'wklejone dane')}`, 'Dopasuj kolumny')}
    <div class="mbody">
      <div class="tablewrap"><table class="map">
        <thead><tr><th scope="col">Kolumna w pliku</th><th scope="col">Przykład</th><th scope="col">Pole w Hermes</th></tr></thead>
        <tbody>${imp.headers.map((h, i) => `<tr><td><b style="color:var(--ink2)">${esc(h)}</b></td><td class="mute">${esc((imp.rows[0] || [])[i] || '')}</td>
          <td><select class="fin sm" data-map="${i}" aria-label="Pole dla kolumny ${esc(h)}"><option value="">— pomiń —</option>${S.fields.map(f => `<option value="${f.key}"${imp.map[i] === f.key ? ' selected' : ''}>${esc(f.label)}</option>`).join('')}</select></td></tr>`).join('')}</tbody>
      </table></div>
      ${ok ? '<p class="hint">Powiązania (np. firmę) dopasujemy po nazwie — brakujące utworzymy automatycznie.</p>' : `<p class="warn">Przypisz kolumnę do pola „${esc(S.fields[0].label)}” — jest wymagane.</p>`}
    </div>
    <div class="mfoot"><button class="ghost-button" data-act="imp-back">Wstecz</button><button class="primary-button" data-act="imp-run"${ok ? '' : ' disabled'}>Importuj ${imp.rows.length} ${ic('arrow', 16)}</button></div>`, 'wide');
  }
}
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0];
  const d = [';', ',', '\t'].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === d) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function loadCSV(text, name) {
  const rows = parseCSV(text);
  if (rows.length < 2) { toast('Nie znaleziono wierszy z danymi'); return; }
  const S = SCHEMA[imp.obj];
  imp.headers = rows[0].map(h => h.trim());
  imp.rows = rows.slice(1).filter(r => r.some(c => String(c).trim()));
  imp.file = name;
  const used = new Set();
  imp.map = imp.headers.map(h => {
    const n = norm(h);
    const f = S.fields.find(f => !used.has(f.key) && [f.label, f.key, ...(ALIAS[f.key] || [])].some(x => norm(x) === n));
    if (f) { used.add(f.key); return f.key; }
    return '';
  });
  imp.step = 2; renderImport();
}
function readFile(file) { const r = new FileReader(); r.onload = () => loadCSV(String(r.result), file.name); r.readAsText(file, 'UTF-8'); }
function runImport() {
  const obj = imp.obj; let n = 0;
  for (const row of imp.rows) {
    const rec = { id: uid(obj[0]), created: today };
    if (obj === 'deal') { rec.stage = 'Nowe'; rec.owner = 'Kamil K.'; }
    if (obj === 'lead') rec.status = 'Nowy';
    imp.map.forEach((k, i) => {
      if (!k) return;
      const f = field(obj, k); let v = String(row[i] ?? '').trim();
      if (!v) return;
      if (f.type === 'relation') {
        let t = db[f.to].find(x => norm(x.name) === norm(v));
        if (!t) { t = { id: uid(f.to[0]), name: v, created: today }; db[f.to].push(t); }
        v = t.id;
      } else if (f.type === 'select') { const o = f.options.find(o => norm(o[0]) === norm(v)); if (!o) return; v = o[0]; }
      else if (f.type === 'money' || f.type === 'number') v = parseVal(f, v);
      else if (f.type === 'date') { v = normDate(v); if (!v) return; }
      rec[k] = v;
    });
    if (rec.name) { db[obj].push(rec); n++; }
  }
  closeModal();
  if (!(state.page === 'pipeline' && obj === 'deal')) { state.page = 'list'; state.obj = obj; state.q = ''; }
  render();
  toast(`Zaimportowano ${n} ${plural(n, 'rekord', 'rekordy', 'rekordów')}`);
}
function downloadTemplate() {
  const S = SCHEMA[imp.obj], r = db[imp.obj][0] || {};
  const ex = S.fields.map(f => f.type === 'relation' ? (nameOf(f.to, r[f.key]) || '') : (r[f.key] ?? ''));
  const q = v => /[",;\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
  const csv = [S.fields.map(f => f.label), ex].map(row => row.map(q).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `hermes-${imp.obj}-szablon.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  toast('Pobrano szablon CSV');
}

/* ================= actions ================= */
function convertLead() {
  const l = find('lead', openRec.id); let comp = null;
  if (l.companyName) {
    comp = db.company.find(c => norm(c.name) === norm(l.companyName));
    if (!comp) { comp = { id: uid('c'), name: l.companyName, created: today }; db.company.unshift(comp); }
  }
  const ct = { id: uid('p'), name: l.name, email: l.email || '', phone: l.phone || '', company: comp ? comp.id : '', created: today };
  db.contact.unshift(ct);
  const d = { id: uid('d'), name: (l.companyName || l.name) + ' — nowa szansa', company: comp ? comp.id : '', contact: ct.id, value: 0, stage: 'Nowe', owner: 'Kamil K.', created: today };
  db.deal.unshift(d);
  l.status = 'Zakwalifikowany';
  openRec = { obj: 'deal', id: d.id };
  render(); renderDrawer();
  toast('Lead skonwertowany — firma, kontakt i szansa gotowe');
}
let toastT;
function toast(msg) {
  const t = $('#toast'); t.innerHTML = `<span>${ic('tick', 14)}</span>${esc(msg)}`; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('mlayer')) { closeModal(); return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (t.tagName === 'A') e.preventDefault();
  switch (a) {
    case 'go':
      state.page = t.dataset.page; if (t.dataset.obj) state.obj = t.dataset.obj; state.q = '';
      openRec = null; renderDrawer(); render(); window.scrollTo(0, 0); break;
    case 'open':
      if (isModal()) closeModal();
      openRec = { obj: t.dataset.obj, id: t.dataset.id }; renderDrawer();
      setTimeout(() => { const b = $('.drawer .sq-btn'); if (b) b.focus(); }, 0); break;
    case 'close-drawer': openRec = null; renderDrawer(); break;
    case 'add': {
      const preset = {};
      if (t.dataset.stage) preset.stage = t.dataset.stage;
      if (t.dataset.pk) preset[t.dataset.pk] = t.dataset.pid;
      openAdd(t.dataset.obj, preset); break;
    }
    case 'import': openImport(t.dataset.obj); break;
    case 'close-modal': closeModal(); break;
    case 'cmdk': openCmd(); break;
    case 'convert': convertLead(); break;
    case 'lost': state.showLost = !state.showLost; renderPipeline(); break;
    case 'task': { const id = t.dataset.id; state.done.has(id) ? state.done.delete(id) : state.done.add(id); renderOverview(); break; }
    case 'del': {
      if (!t.dataset.armed) { t.dataset.armed = '1'; t.innerHTML = ic('trash', 15) + 'Kliknij ponownie, aby usunąć'; return; }
      const { obj, id } = openRec, r = find(obj, id);
      db[obj] = db[obj].filter(x => x.id !== id);
      for (const o of OBJS) for (const f of SCHEMA[o].fields) if (f.type === 'relation' && f.to === obj) db[o].forEach(x => { if (x[f.key] === id) x[f.key] = ''; });
      openRec = null; renderDrawer(); render(); toast(`Usunięto: ${r.name}`); break;
    }
    case 'stab': state.settingsObj = t.dataset.obj; renderSettings(); break;
    case 'del-field': {
      if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'Na pewno?'; return; }
      const S = SCHEMA[state.settingsObj], f = field(state.settingsObj, t.dataset.key);
      S.fields = S.fields.filter(x => x.key !== t.dataset.key);
      renderSettings(); toast(`Usunięto pole: ${f.label}`); break;
    }
    case 'aowner': state.aOwner = t.dataset.v; renderAnalytics(); break;
    case 'tmpl': downloadTemplate(); break;
    case 'imp-paste': {
      const v = $('#csvpaste').value;
      if (!v.trim()) { toast('Wybierz plik albo wklej dane'); return; }
      loadCSV(v, null); break;
    }
    case 'imp-back': imp.step = 1; renderImport(); break;
    case 'imp-run': runImport(); break;
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const form = e.target, fd = new FormData(form);
  if (form.id === 'addForm') {
    const obj = form.dataset.obj, S = SCHEMA[obj];
    const rec = { id: uid(obj[0]), created: today };
    if (obj === 'deal') { rec.stage = 'Nowe'; rec.owner = 'Kamil K.'; }
    if (obj === 'lead') rec.status = 'Nowy';
    for (const f of S.fields) { const v = fd.get(f.key); if (v !== null && String(v).trim() !== '') rec[f.key] = parseVal(f, v); }
    if (!rec.name) {
      const i = $('#n-name'); i.classList.add('err'); i.setAttribute('aria-invalid', 'true'); i.focus();
      const err = $('#addErr'); err.className = 'warn'; err.textContent = `Podaj: ${field(obj, 'name').label.toLowerCase()}.`;
      return;
    }
    db[obj].unshift(rec);
    closeModal(); render(); if (openRec) renderDrawer();
    toast(`Dodano: ${rec.name}`);
  }
  if (form.id === 'fieldForm') {
    const label = String(fd.get('label') || '').trim(), type = fd.get('type');
    if (!label) { $('#nf-label').classList.add('err'); $('#nf-label').focus(); return; }
    const f = { key: 'cf' + (++_id), label, type };
    if (type === 'select') {
      const opts = String(fd.get('options') || '').split(',').map(s => s.trim()).filter(Boolean);
      if (!opts.length) { $('#nf-opt').classList.add('err'); $('#nf-opt').focus(); toast('Podaj opcje listy, oddzielone przecinkami'); return; }
      f.options = opts.map((o, i) => [o, CYCLE[i % CYCLE.length]]);
    }
    SCHEMA[state.settingsObj].fields.push(f);
    renderSettings(); toast(`Dodano pole: ${label}`);
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.edit && openRec) {
    const r = find(openRec.obj, openRec.id), f = field(openRec.obj, t.dataset.edit);
    const v = parseVal(f, t.value);
    if (f.key === 'name' && !v) { t.value = r.name; return; }
    r[f.key] = v;
    const sub = $('#hero-sub'); if (sub) sub.textContent = subtitle(openRec.obj, r) || ' ';
    renderSide(); renderMain();
    return;
  }
  if (t.dataset.map !== undefined && imp) { imp.map[+t.dataset.map] = t.value; renderImport(); return; }
  if (t.dataset.fl) {
    const f = field(state.settingsObj, t.dataset.fl);
    if (t.value.trim()) { f.label = t.value.trim(); toast('Zapisano nazwę pola'); } else t.value = f.label;
    return;
  }
  if (t.id === 'csvfile' && t.files[0]) readFile(t.files[0]);
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.role === 'q') { state.q = t.value; renderRows(); }
  else if (t.dataset.role === 'cmdq') renderCmd(t.value);
  else if (t.classList.contains('err')) t.classList.remove('err');
});

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmd(); return; }
  if (e.key === 'Escape') { if (isModal()) closeModal(); else if (openRec) { openRec = null; renderDrawer(); } return; }
  if (e.key === 'Enter' && e.target.id === 'cmdq') { const b = $('#cmdres .cmdrow'); if (b) b.click(); return; }
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
  if (e.key === 'Enter' && e.target.classList.contains('deal-card')) { e.target.click(); return; }
  if (e.key === 'n' && !e.metaKey && !e.ctrlKey && !isModal()) { e.preventDefault(); openAdd(addLabel()[1]); }
});

/* chart tooltips */
const tip = $('#tip');
function showTip(el, x, y) {
  tip.textContent = el.dataset.tip; tip.classList.add('show');
  const w = tip.offsetWidth;
  tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x - w / 2)) + 'px';
  tip.style.top = Math.max(8, y - 46) + 'px';
}
document.addEventListener('mousemove', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) showTip(el, e.clientX, e.clientY); else tip.classList.remove('show');
});
document.addEventListener('focusin', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top); } else tip.classList.remove('show');
});

/* drag & drop: kanban + CSV */
document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('.deal-card'); if (!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging');
});
document.addEventListener('dragend', () => document.querySelectorAll('.dragging,.over').forEach(x => x.classList.remove('dragging', 'over')));
document.addEventListener('dragover', e => {
  const col = e.target.closest && e.target.closest('.kcol'), drop = e.target.closest && e.target.closest('.drop');
  if (!col && !drop) return;
  e.preventDefault();
  const el = col || drop;
  document.querySelectorAll('.over').forEach(x => x !== el && x.classList.remove('over'));
  el.classList.add('over');
});
document.addEventListener('drop', e => {
  const drop = e.target.closest && e.target.closest('.drop');
  if (drop) { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) readFile(f); return; }
  const col = e.target.closest && e.target.closest('.kcol'); if (!col) return;
  e.preventDefault();
  const d = find('deal', e.dataTransfer.getData('text/plain'));
  if (d && d.stage !== col.dataset.stage) { d.stage = col.dataset.stage; render(); toast(`${d.name} → ${d.stage}`); }
  else col.classList.remove('over');
});

render();
</script>
</body>
